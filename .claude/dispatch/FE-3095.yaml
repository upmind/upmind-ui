# Runner deviation, operator-directed (precedence tier 1 over skill text).
# dispatch/increment.workflow.mjs has no shipless mode: Ship always pushes and
# opens a CR, and Review/Verify bind to "the pushed diff" / "the pushed branch
# HEAD". The operator ruled no push, no CR, so three stage prompts are varied to
# bind to the LOCAL commit range instead:
#   Ship   — commit + return the range and HEAD; no push, no CR
#   Review — read the local range, not the pushed diff
#   Verify — bind to local HEAD, not the pushed branch HEAD
# Plan / Develop / Prove / Green / Document are byte-identical to the shipped
# script. No seat identity, agentType, model pin, or gate order was touched.
runnerDeviation: ship-review-verify-bind-to-local-range-no-push-no-CR

