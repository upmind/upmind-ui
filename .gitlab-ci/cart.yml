variables:
  CLOUDFLARE_ACCOUNT_ID: bbea1ad205044fc70dc376a24f7c41c4
  GCP_SERVICE_ACCOUNT_JSON: ${GCP_SERVICE_ACCOUNT_JSON_CART}

#-------------------------------------------------------------------------------
# 🛠️ Build
#-------------------------------------------------------------------------------

.(apps/cart) build base:
  extends: .pnpm
  stage: build
  interruptible: true
  needs:
    - dependencies
  cache:
    - key:
        files:
          - apps/cart/package.json
          - apps/cart/pnpm-lock.yaml
      paths:
        - apps/cart/node_modules
  artifacts:
    when: on_success
    access: all
    expire_in: "1 day"
    paths:
      - apps/cart/dist
  before_script:
    - corepack enable
    - corepack prepare pnpm@latest --activate
    - pnpm --version
    - pnpm -r --workspace-concurrency=1 build

(apps/cart) build staging:
  extends: .(apps/cart) build base
  rules:
    - if: $CI_PIPELINE_SOURCE == 'web'
      when: manual
    - if: $CI_COMMIT_TAG =~ /^cart-staging-v\d+(\.\d+)+$/
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event' && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == 'main'
  script:
    # Rebuild the cart for staging
    - rm -rf apps/cart/dist
    - pnpm --dir apps/cart run build:staging
    - cp apps/cart/_headers apps/cart/dist/_headers

(apps/cart) build production:
  extends: .(apps/cart) build base
  rules:
    - if: $CI_PIPELINE_SOURCE == 'web'
      when: manual
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event' && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == 'develop'
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
      when: manual
      allow_failure: true
    - if: $CI_COMMIT_TAG =~ /^cart-v\d+(\.\d+)+$/
    - if: $CI_COMMIT_TAG =~ /^cart-v\d+(\.\d+)+-rc\d+$/
  script:
    - cp apps/cart/_headers apps/cart/dist/_headers

#-------------------------------------------------------------------------------
# 🌤️ Cloudflare pages deployments
#-------------------------------------------------------------------------------

.(apps/cart) deploy base - cloudflare pages:
  extends: .pnpm
  stage: deploy
  interruptible: true
  script:
    - cd apps/cart
    - |
      set -u
      pnpm npx wrangler pages deploy \
        --branch "${DEPLOY_BRANCH}" \
        --commit-dirty=true \
        --project-name "${PAGES_PROJECT_NAME}" \
        dist

(apps/cart) deploy staging - cloudflare pages:
  extends: .(apps/cart) deploy base - cloudflare pages
  needs:
    - dependencies
    - (apps/cart) build staging
  rules:
    - if: $CI_COMMIT_TAG =~ /^cart-staging-v\d+(\.\d+)+$/
    - if: $CI_PIPELINE_SOURCE == "web"
      when: manual
  environment:
    name: apps/cart/cloudflare/staging
    action: start
    url: https://staging.cart.cdn.upmind.io
  variables:
    DEPLOY_BRANCH: staging
    PAGES_PROJECT_NAME: upmind-cart-staging

(apps/cart) deploy production - cloudflare pages:
  extends: .(apps/cart) deploy base - cloudflare pages
  stage: deploy
  needs:
    - dependencies
    - (apps/cart) build production
  rules:
    # Allow failure when it's not the primary deloy mechanism
    - if: $CI_COMMIT_TAG =~ /^cart-v\d+(\.\d+)+$/ && $CART_PRIMARY_DEPLOY =~ /cloudflare/
      allow_failure: false
    - if: $CI_COMMIT_TAG =~ /^cart-v\d+(\.\d+)+$/ && $CART_PRIMARY_DEPLOY !~ /cloudflare/
      allow_failure: true
  environment:
    name: apps/cart/cloudflare/production
    action: start
    url: https://cart.my.upmind.com/
  variables:
    DEPLOY_BRANCH: "main"
    PAGES_PROJECT_NAME: upmind-cart

#-------------------------------------------------------------------------------
# 🔥 Firebase deployments
#-------------------------------------------------------------------------------

.(apps/cart) deploy base - firebase:
  extends: .pnpm
  stage: deploy
  script:
    - echo "${GCP_SERVICE_ACCOUNT_JSON}" > ${GOOGLE_APPLICATION_CREDENTIALS}
    - cd apps/cart
    - |
      if [ -n "${CI_COMMIT_TAG}" ]; then
        message="${CI_COMMIT_TAG}"
      else
        message="${CI_COMMIT_SHORT_SHA}"
      fi

      pnpm exec firebase deploy --only hosting:${FIREBASE_DEPLOY_TARGET} --message "${message}"

(apps/cart) deploy staging - firebase:
  extends: .(apps/cart) deploy base - firebase
  needs:
    - dependencies
    - (apps/cart) build staging
  rules:
    - if: $CI_COMMIT_TAG =~ /^cart-staging-v\d+(\.\d+)+$/
    - if: $CI_PIPELINE_SOURCE == "web"
      when: manual
  environment:
    name: apps/cart/firebase/staging
    action: start
    url: ${FIREBASE_ENVIRONMENT_URL_STAGING}
  variables:
    FIREBASE_DEPLOY_TARGET: upmind-cart-staging

(apps/cart) deploy production - firebase:
  extends: .(apps/cart) deploy base - firebase
  stage: deploy
  needs:
    - dependencies
    - (apps/cart) build production
  rules:
    # Allow failure when it's not the primary deloy mechanism
    - if: $CI_COMMIT_TAG =~ /^cart-v\d+(\.\d+)+$/ && $CART_PRIMARY_DEPLOY =~ /firebase/
      allow_failure: false
    - if: $CI_COMMIT_TAG =~ /^cart-v\d+(\.\d+)+$/ && $CART_PRIMARY_DEPLOY !~ /firebase/
      allow_failure: true
  environment:
    name: apps/cart/firebase/production
    action: start
    url: ${FIREBASE_ENVIRONMENT_URL_PRODUCTION}
  variables:
    FIREBASE_DEPLOY_TARGET: upmind-cart

#------------------------------------------------------------------------------
# 📢 Notify
#------------------------------------------------------------------------------

(apps/cart) notify slack:
  stage: deploy
  image: ${SLACK_NOTIFY_IMAGE}
  rules:
    - if: $CI_COMMIT_TAG =~ /^cart-v\d+(\.\d+)+$/
      variables: { CI_ENVIRONMENT_URL: https://cart.my.upmind.com }
    - if: $CI_COMMIT_TAG =~ /^cart-staging-v\d+(\.\d+)+$/
      variables: { CI_ENVIRONMENT_URL: https://cart.my.upmind.dev }
    - if: $CI_COMMIT_TAG =~ /^cart-v\d+(\.\d+)+-rc\d+$/
  allow_failure: true
  script:
    - /slacker deploy
  variables:
    MONOREPO_PROJECT: apps/cart
