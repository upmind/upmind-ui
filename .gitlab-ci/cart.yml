variables:
  CLOUDFLARE_ACCOUNT_ID: bbea1ad205044fc70dc376a24f7c41c4
  GCP_SERVICE_ACCOUNT_JSON: ${GCP_SERVICE_ACCOUNT_JSON_CART}
  GCS_BUCKET_PRODUCTION: upmind-cart
  GCS_BUCKET_STAGING: upmind-cart-staging

#-------------------------------------------------------------------------------
# 🛠️ Build
#-------------------------------------------------------------------------------

build base:
  extends: .pnpm
  stage: build
  interruptible: true
  tags: [xl]
  needs:
    - dependencies
  rules:
    - if: $CI_PIPELINE_SOURCE == 'web'
    - if: $CI_COMMIT_TAG =~ /^cart-v\d+(\.\d+)+$/
    - if: $CI_COMMIT_TAG =~ /^cart-v\d+(\.\d+)+-rc\d+$/
    - if: $CI_COMMIT_TAG =~ /^cart-staging-v\d+(\.\d+)+$/
    - if: $CI_COMMIT_TAG =~ /^velia-v\d+(\.\d+)+$/
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event' && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == 'main'
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event' && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == 'develop'
  artifacts:
    when: on_success
    access: all
    expire_in: "3 days"
    paths:
      - packages/client-vue/dist
      - packages/headless/dist
      - design-system/packages/ui/dist
      - packages/icons/dist
      - packages/i18n/dist
      - packages/types/dist
      # The ADR 023 domain packages (modules-auth, modules-foundation, …) the
      # apps reference by project reference — their d.ts must reach the app jobs.
      - packages/modules-*/dist

      - apps/cart/dist

  script:
    - ls -a packages/types
    - ls -a design-system/packages/ui
    - pnpm -r --workspace-concurrency=1 --filter '!@upmind-automation/labs-nuxt' build

(apps/cart) build staging:
  extends: .pnpm
  stage: build
  interruptible: true
  tags: [xl]
  needs:
    - dependencies
    - job: build base
      optional: true
  rules:
    - if: $CI_PIPELINE_SOURCE == 'web'
      when: manual
    - if: $CI_COMMIT_TAG =~ /^cart-staging-v\d+(\.\d+)+$/
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event' && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == 'main'
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event' && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == 'develop'
  script:
    # The design-system packages ship dist the app builds consume (tokens
    # css + ui d.ts) — CI must build them first; a dev machine has them built.
    - pnpm --filter @upmind/tokens build && pnpm --filter @upmind/ui build
    # The production cart is built in 'build-base' - rebuild the cart for staging
    - rm -rf apps/cart/dist
    - pnpm --dir apps/cart run build:staging

    # For Cloudflare pages
    - cp apps/cart/deploy/_headers apps/cart/dist/_headers

(apps/cart) build production:
  extends: .pnpm
  stage: build
  interruptible: true
  needs:
    - dependencies
    - job: build base
      optional: true
  artifacts:
    when: on_success
    access: all
    expire_in: "1 day"
    paths:
      - apps/cart/dist
  rules:
    - if: $CI_PIPELINE_SOURCE == 'web'
      when: manual
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event' && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == 'main'
      allow_failure: false
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event' && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == 'develop'
      allow_failure: true
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
      when: manual
      allow_failure: true
    - if: $CI_COMMIT_TAG =~ /^cart-v\d+(\.\d+)+$/
    - if: $CI_COMMIT_TAG =~ /^cart-v\d+(\.\d+)+-rc\d+$/
  script:
    # For Cloudflare pages
    - cp apps/cart/deploy/_headers apps/cart/dist/_headers

(apps/velia-nuxt) build:
  extends: .pnpm
  stage: build
  interruptible: true
  tags: [xl]
  needs:
    - dependencies
    - job: build base
      optional: true
  cache:
    - key:
        files:
          - apps/velia-nuxt/package.json
          - pnpm-lock.yaml
      paths:
        - apps/velia-nuxt/node_modules
  artifacts:
    when: on_success
    access: all
    expire_in: "3 days"
    paths:
      - apps/velia-nuxt/.output
  rules:
    - if: $CI_PIPELINE_SOURCE == 'web'
      when: manual
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event' && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == 'main'
      allow_failure: false
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event' && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == 'develop'
      allow_failure: true
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
      when: manual
      allow_failure: true
    - if: $CI_COMMIT_TAG =~ /^cart-v\d+(\.\d+)+$/
    - if: $CI_COMMIT_TAG =~ /^velia-v\d+(\.\d+)+$/
  script:
    # The design-system packages ship dist the app builds consume (tokens
    # css + ui d.ts) — CI must build them first; a dev machine has them built.
    - pnpm --filter @upmind/tokens build && pnpm --filter @upmind/ui build
    - cd apps/velia-nuxt
    - pnpm run build:prod

.deploy cloudflare pages:
  extends: .pnpm
  stage: deploy
  interruptible: true
  script:
    - cd apps/cart
    - |
      set -u
      pnpm npx wrangler pages deploy \
        --branch "${DEPLOY_BRANCH}" \
        --commit-dirty=true \
        --project-name "${PAGES_PROJECT_NAME}" \
        dist

(apps/cart) deploy cloudflare pages - staging:
  extends: .deploy cloudflare pages
  needs:
    - dependencies
    - (apps/cart) build staging
  rules:
    - if: $CI_COMMIT_TAG =~ /^cart-staging-v\d+(\.\d+)+$/
    - if: $CI_PIPELINE_SOURCE == "web"
      when: manual
  environment:
    name: apps/cart/cloudflare/staging
    action: start
    url: https://staging.cart.cdn.upmind.io
  variables:
    DEPLOY_BRANCH: staging
    PAGES_PROJECT_NAME: upmind-cart-staging

(apps/cart) deploy cloudflare pages - production:
  extends: .deploy cloudflare pages
  stage: deploy
  needs:
    - dependencies
    - (apps/cart) build production
  rules:
    # Allow failure when it's not the primary deploy mechanism
    - if: $CI_COMMIT_TAG =~ /^cart-v\d+(\.\d+)+$/ && $CART_PRIMARY_DEPLOY =~ /cloudflare/
      allow_failure: false
    - if: $CI_COMMIT_TAG =~ /^cart-v\d+(\.\d+)+$/ && $CART_PRIMARY_DEPLOY !~ /cloudflare/
      allow_failure: true
  environment:
    name: apps/cart/cloudflare/production
    action: start
    url: https://cart.my.upmind.com/
  variables:
    DEPLOY_BRANCH: "main"
    PAGES_PROJECT_NAME: upmind-cart

#-------------------------------------------------------------------------------
# ☁️ GCS deployments — Cacheable assets (JS, CSS, fonts, images)
#-------------------------------------------------------------------------------

.deploy gcs:
  stage: deploy
  image: google/cloud-sdk:alpine
  interruptible: true
  script:
    - set -u
    - echo "${GCP_SERVICE_ACCOUNT_JSON}" > ${GOOGLE_APPLICATION_CREDENTIALS}
    - |
      cd ${APP_DIR}
      bash "${CI_PROJECT_DIR}/etc/scripts/deploy-gcs.sh" --bucket "${GCS_BUCKET}" --prefix "${GCS_PREFIX}" --dist "${GCS_DIST:-dist}"

(apps/cart) deploy gcs - staging:
  extends: .deploy gcs
  needs:
    - dependencies
    - (apps/cart) build staging
  rules:
    - if: $CI_COMMIT_TAG =~ /^cart-staging-v\d+(\.\d+)+$/
    - if: $CI_PIPELINE_SOURCE == "web"
      when: manual
  environment:
    name: apps/cart/gcs/staging
    action: start
    url: https://assets.upmind-cart-staging.upmind.io/
  variables:
    APP_DIR: apps/cart
    GCS_BUCKET: ${GCS_BUCKET_STAGING}
    GCS_PREFIX: staging

(apps/cart) deploy gcs - production:
  extends: .deploy gcs
  stage: deploy
  needs:
    - dependencies
    - (apps/cart) build production
  rules:
    - if: $CI_COMMIT_TAG =~ /^cart-v\d+(\.\d+)+$/ && $CART_PRIMARY_DEPLOY =~ /firebase/
      allow_failure: false
    - if: $CI_COMMIT_TAG =~ /^cart-v\d+(\.\d+)+$/ && $CART_PRIMARY_DEPLOY !~ /firebase/
      allow_failure: true
  environment:
    name: apps/cart/gcs/production
    action: start
    url: https://assets.upmind-cart.upmind.io/
  variables:
    APP_DIR: apps/cart
    GCS_BUCKET: ${GCS_BUCKET_PRODUCTION}
    GCS_PREFIX: production

(apps/velia-nuxt) deploy gcs:
  extends: .deploy gcs
  needs:
    - dependencies
    - job: build base
      optional: true
    - (apps/velia-nuxt) build
  rules:
    - if: $CI_COMMIT_TAG =~ /^cart-v\d+(\.\d+)+$/ && $CART_PRIMARY_DEPLOY =~ /firebase/
      allow_failure: false
    - if: $CI_COMMIT_TAG =~ /^velia-v\d+(\.\d+)+$/ && $CART_PRIMARY_DEPLOY =~ /firebase/
      allow_failure: false
    - if: $CI_COMMIT_TAG =~ /^cart-v\d+(\.\d+)+$/ && $CART_PRIMARY_DEPLOY !~ /firebase/
      allow_failure: true
    - if: $CI_COMMIT_TAG =~ /^velia-v\d+(\.\d+)+$/ && $CART_PRIMARY_DEPLOY !~ /firebase/
      allow_failure: true
  environment:
    name: apps/velia-nuxt/gcs/production
    action: start
  variables:
    APP_DIR: apps/velia-nuxt
    GCS_BUCKET: ${GCS_BUCKET_PRODUCTION}
    GCS_PREFIX: velia
    GCS_DIST: .output/public

.deploy firebase:
  extends: .pnpm
  stage: deploy
  script:
    - set -u
    - echo "${GCP_SERVICE_ACCOUNT_JSON}" > ${GOOGLE_APPLICATION_CREDENTIALS}
    - |
      if [ -n "${CI_COMMIT_TAG}" ]; then
        message="${CI_COMMIT_TAG}"
      else
        message="${CI_COMMIT_SHORT_SHA}"
      fi

      pnpm --dir ${APP_DIR} exec firebase deploy --project ${FIREBASE_PROJECT:-default} --only hosting:${FIREBASE_DEPLOY_TARGET} --message "${message}"

(apps/cart) deploy firebase - staging:
  extends: .deploy firebase
  needs:
    - dependencies
    - (apps/cart) build staging
    - (apps/cart) deploy gcs - staging
  rules:
    - if: $CI_COMMIT_TAG =~ /^cart-staging-v\d+(\.\d+)+$/
    - if: $CI_PIPELINE_SOURCE == "web"
      when: manual
  environment:
    name: apps/cart/firebase/staging
    action: start
    url: ${FIREBASE_ENVIRONMENT_URL_STAGING}
  variables:
    APP_DIR: apps/cart
    FIREBASE_PROJECT: upmind-cart
    FIREBASE_DEPLOY_TARGET: upmind-cart-staging

(apps/cart) deploy firebase - production:
  extends: .deploy firebase
  stage: deploy
  needs:
    - dependencies
    - (apps/cart) build production
    - (apps/cart) deploy gcs - production
  rules:
    # Allow failure when it's not the primary deploy mechanism
    - if: $CI_COMMIT_TAG =~ /^cart-v\d+(\.\d+)+$/ && $CART_PRIMARY_DEPLOY =~ /firebase/
      allow_failure: false
    - if: $CI_COMMIT_TAG =~ /^cart-v\d+(\.\d+)+$/ && $CART_PRIMARY_DEPLOY !~ /firebase/
      allow_failure: true
  environment:
    name: apps/cart/firebase/production
    action: start
    url: ${FIREBASE_ENVIRONMENT_URL_PRODUCTION}
  variables:
    APP_DIR: apps/cart
    FIREBASE_PROJECT: upmind-cart
    FIREBASE_DEPLOY_TARGET: upmind-cart

(apps/velia-nuxt) deploy firebase:
  extends: .deploy firebase
  stage: deploy
  needs:
    - dependencies
    - job: build base
      optional: true
    - (apps/velia-nuxt) build
    - (apps/velia-nuxt) deploy gcs
  rules:
    # Allow failure when it's not the primary deploy mechanism
    - if: $CI_COMMIT_TAG =~ /^cart-v\d+(\.\d+)+$/ && $CART_PRIMARY_DEPLOY =~ /firebase/
      allow_failure: false
    - if: $CI_COMMIT_TAG =~ /^velia-v\d+(\.\d+)+$/ && $CART_PRIMARY_DEPLOY =~ /firebase/
      allow_failure: false

    - if: $CI_COMMIT_TAG =~ /^cart-v\d+(\.\d+)+$/ && $CART_PRIMARY_DEPLOY !~ /firebase/
      allow_failure: true
    - if: $CI_COMMIT_TAG =~ /^velia-v\d+(\.\d+)+$/ && $CART_PRIMARY_DEPLOY !~ /firebase/
      allow_failure: true
  environment:
    name: apps/velia-nuxt/firebase/production
    action: start
    url: ${FIREBASE_ENVIRONMENT_URL_PRODUCTION}
  variables:
    APP_DIR: apps/velia-nuxt
    FIREBASE_DEPLOY_TARGET: velia

(apps/cart) notify slack:
  stage: deploy
  image: ${SLACK_NOTIFY_IMAGE}
  rules:
    - if: $CI_COMMIT_TAG =~ /^cart-v\d+(\.\d+)+$/
      variables: { CI_ENVIRONMENT_URL: https://cart.my.upmind.com }
    - if: $CI_COMMIT_TAG =~ /^cart-staging-v\d+(\.\d+)+$/
      variables: { CI_ENVIRONMENT_URL: https://cart.my.upmind.dev }
    - if: $CI_COMMIT_TAG =~ /^cart-v\d+(\.\d+)+-rc\d+$/
  allow_failure: true
  script:
    - /slacker deploy
  variables:
    MONOREPO_PROJECT: apps/cart
