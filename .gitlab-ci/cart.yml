variables:
  CLOUDFLARE_ACCOUNT_ID: bbea1ad205044fc70dc376a24f7c41c4
  CLOUDFLARE_PAGES_PROJECT_CART: upmind-cart

#-------------------------------------------------------------------------------
# 🛠️ Build
#-------------------------------------------------------------------------------

.(apps/cart) build base:
  extends: .pnpm
  stage: build
  interruptible: true
  needs:
    - dependencies
  cache:
    - key:
        files:
          - docs/package.json
          - docs/package-lock.json
      paths:
        - docs/node_modules
  artifacts:
    when: on_success
    access: all
    expire_in: "1 day"
    paths:
      - apps/cart/dist
  before_script:
    - corepack enable
    - corepack prepare pnpm@latest --activate
    - pnpm --version
    - pnpm run build

(apps/cart) build staging:
  extends: .(apps/cart) build base
  rules:
    - if: $CI_COMMIT_TAG =~ /^cart-staging-v\d+(\.\d+)+$/
  script:
    - rm -rf apps/cart/dist
    - pnpm --dir apps/cart run build:staging
    - cp apps/cart/_headers apps/cart/dist/_headers

(apps/cart) build production:
  extends: .(apps/cart) build base
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event' && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG =~ /^cart-v\d+(\.\d+)+$/
    - if: $CI_COMMIT_TAG =~ /^cart-v\d+(\.\d+)+-rc\d+$/
  script:
    - cp apps/cart/_headers apps/cart/dist/_headers

#-------------------------------------------------------------------------------
# 🚀 Deploy
#-------------------------------------------------------------------------------

.(apps/cart) deploy base:
  extends: .pnpm
  stage: deploy
  interruptible: true
  needs:
    - dependencies
    - (apps/cart) build
  script:
    - cd apps/cart
    - |
      set -u
      pnpm npx wrangler pages deploy \
        --branch "${DEPLOY_BRANCH}" \
        --commit-dirty=true \
        --project-name "${CLOUDFLARE_PAGES_PROJECT_CART}" \
        dist

(apps/cart) deploy staging:
  extends: .(apps/cart) deploy base
  needs:
    - dependencies
    - (apps/cart) build staging
  rules:
    - if: $CI_COMMIT_TAG =~ /^cart-staging-v\d+(\.\d+)+$/
  environment:
    name: apps/cart/staging
    action: start
    url: https://staging.cart.cdn.upmind.io
  variables:
    DEPLOY_BRANCH: staging

(apps/cart) deploy production release candidate:
  extends: .(apps/cart) deploy base
  needs:
    - dependencies
    - (apps/cart) build production
  rules:
    - if: $CI_COMMIT_TAG =~ /^cart-v\d+(\.\d+)+-rc\d+$/
      allow_failure: true
  environment:
    name: apps/cart/rc/${CI_COMMIT_REF_SLUG}
    action: start
    auto_stop_in: 7 days
    url: https://${CI_COMMIR_REF_SLUG}.${CLOUDFLARE_PAGES_PROJECT_CART}.pages.dev
    on_stop: (apps/cart) stop production release candidate
  variables:
    DEPLOY_BRANCH: "${CI_COMMIT_SLUG}"

(apps/cart) stop production release candidate:
  extends: .pnpm
  stage: stop
  needs: []
  environment:
    name: apps/cart/rc/${CI_COMMIT_REF_SLUG}
    action: stop
  rules:
    - when: manual
      allow_failure: true
  script:
    - apk add curl
    - |
      curl --request DELETE \
          --url https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${CLOUDFLARE_PAGES_PROJECT_CART}/deployments/${CI_COMMIT_REF_SLUG}  \
          --header 'Content-Type: application/json' \
          --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"

(apps/cart) deploy production:
  extends: .(apps/cart) deploy base
  stage: deploy
  needs:
    - dependencies
    - (apps/cart) build production
  rules:
    - if: $CI_COMMIT_TAG =~ /^cart-v\d+(\.\d+)+$/
  environment:
    name: apps/cart/main
    action: start
    url: https://cart.my.upmind.com/
  variables:
    DEPLOY_BRANCH: "main"

(apps/cart) notify slack:
  stage: deploy
  image: ${SLACK_NOTIFY_IMAGE}
  rules:
    - if: $CI_COMMIT_TAG =~ /^cart-v\d+(\.\d+)+$/
      variables: { CI_ENVIRONMENT_URL: https://cart.my.upmind.com }
    - if: $CI_COMMIT_TAG =~ /^cart-staging-v\d+(\.\d+)+$/
      variables: { CI_ENVIRONMENT_URL: https://cart.my.upmind.dev }
    - if: $CI_COMMIT_TAG =~ /^cart-v\d+(\.\d+)+-rc\d+$/
  allow_failure: true
  script:
    - /slacker deploy
  variables:
    MONOREPO_PROJECT: apps/cart
