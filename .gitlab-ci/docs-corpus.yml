# Docs-corpus drift-gate lane (FE-2752, FE-2753, FE-2950, FE-3003, FE-3271).
# The corpus and these gates are the product (ADR-026). Mintlify is a swappable
# rendering target.
#
# The lane shape follows the sibling ci/docs-corpus-gate.yml (a separate docs-tree
# honesty gate, no overlap): the same SKIP_* escape hatch, the same no-silent-bypass
# posture (each engine's exit code is captured and propagated, never masked behind a
# pipe), the same findings-log artifact, and the same change-glob rules.
#
# No MR gate reads the pages at the superproject's submodule pointer (FE-3271). The
# MR builds its own pages, gates them, and commits them to its own mintlify-docs
# branch, preview/mr-<iid> (ADR-026 Amendment 2):
#
#   dependencies
#        │
#        ├─ corpus:build ── typedoc --json reflection → build.mjs → corpus.json
#        │      │           → emit-mdx.mjs --out .corpus-fresh (the fresh pages)
#        │      │           artifacts: .reflection.json + .corpus-fresh/**
#        │      ├─ gate:examples    (vue-tsc snippets vs real workspace exports)
#        │      ├─ gate:api-drift   (fresh reflection vs committed corpus.json;
#        │      │                    stale pages read from --pages .corpus-fresh)
#        │      ├─ gate:symbols     (documented symbols + glossary referents live)
#        │      └─ gate:authorship  (--pages .corpus-fresh: integrity pins, fresh-page
#        │                           provenance, hand-authored boundary)
#        │
#        └─ corpus:preview-check  (MR only: hand-edits on preview/mr-<iid> since the
#                                   newest docs-bot commit, and "generated" keys on
#                                   hand-authored pages; writes PREVIEW_LEASE_SHA)
#
#   corpus:emit  needs [corpus:build + all four gates + corpus:preview-check], so
#                GitLab skips it on any red (2753-AC2). On an MR it commits
#                .corpus-fresh to preview/mr-<iid> as the docs bot, with
#                force-with-lease on PREVIEW_LEASE_SHA (the dotenv report of
#                corpus:preview-check). On develop it only fills the artifact paths
#                FE-2949's publish/canary seam consumes.
#
#   The first push of an MR has no preview branch, so the check passes and emit
#   creates the branch from mintlify-docs develop. On merge, the post-merge job
#   merges preview/mr-<iid> into mintlify-docs develop and deletes it, then runs
#   the refresh backstop. Remedy for a red check: revert the hand-edit on the
#   preview branch, or delete the branch, then push the MR again.
#
# Every gate is allow_failure: false (2753-AC1): a red gate blocks the MR and makes
# corpus:emit unreachable.
#
# gate:api-drift still diffs fresh symbols against the committed corpus.json, and
# gate:symbols reads the committed surface. Each gate clones the repo for its own
# committed corpus.json and downloads only the artifacts, so the build's
# regenerated corpus.json never clobbers the committed view the diff needs.
#
# GIT_DEPTH: 0 on corpus:build only, because build.mjs reads `git tag -l 'docs-v*'`
# and a bounded `git log` for the changelog window. The preview jobs re-clone the
# submodule with etc/ci/mintlify-git-setup.sh for its history.
#
# Runtime: the gates run in parallel after corpus:build, adding roughly 4-9 min, well
# inside the 30-min per-MR ceiling (ADR-021). Nothing here runs a browser, a dev
# server, or the e2e suite.

# --- shared config (stage, interruptible, trigger rules) -------------------
# Trigger rules (FE-2752 review item #7): MR pipelines and default-branch pushes that
# touch docs/corpus/** or this lane file. The lane runs on docs-corpus MRs, not every
# code MR. Trade-off: a code-only MR that renames an exported symbol does not trip
# gate:api-drift or gate:symbols here. The post-merge job below is the backstop.
.docs-corpus:
  stage: test
  interruptible: true
  variables:
    DOCS_CORPUS_CI_ENABLED: "true"
  rules:
    - if: '$DOCS_CORPUS_CI_ENABLED != "true"'
      when: never
    - if: $SKIP_DOCS_CORPUS == "true"
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - docs/corpus/**/*
        - .gitlab-ci/docs-corpus.yml
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - docs/corpus/**/*
        - .gitlab-ci/docs-corpus.yml

#------------------------------------------------------------------------------
# corpus:build: the one TypeDoc run in the lane. Produces the fresh corpus.json in
# its own workspace, emits the fresh pages from it into .corpus-fresh, and publishes
# .reflection.json (gitignored, so it exists only as this artifact) and
# .corpus-fresh/** for the gates and corpus:emit. GIT_DEPTH: 0 for the docs-v* tags
# and the changelog window.
#------------------------------------------------------------------------------
corpus:build:
  extends:
    - .pnpm
    - .docs-corpus
  needs:
    - dependencies
  variables:
    GIT_DEPTH: 0
  allow_failure: false
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - docs/corpus/.reflection.json
      - .corpus-fresh/
      - corpus-build.log
  script:
    - |
      set -o pipefail
      if { pnpm --filter docs corpus:build && node docs/corpus/emit-mdx.mjs --out .corpus-fresh; } 2>&1 | tee corpus-build.log; then
        echo "[corpus:build] GREEN — corpus.json + .reflection.json built, fresh pages emitted to .corpus-fresh."
      else
        status=$?
        echo "[corpus:build] RED — corpus build failed (build error / schema violation / glossary parse error above)."
        exit "$status"
      fi

#------------------------------------------------------------------------------
# gate:examples: build every corpus example snippet and marked fenced snippet into a
# temp project that imports the real workspace packages, then one vue-tsc --noEmit
# pass. An empty set is green with a count. Runs vue-tsc from the dependencies
# node_modules artifact.
#------------------------------------------------------------------------------
gate:examples:
  extends: .docs-corpus
  image: ${NODE_IMAGE}
  needs:
    - dependencies
    - corpus:build
  allow_failure: false
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - gate-examples.log
  script:
    - |
      set -o pipefail
      if node docs/corpus/gates/gate-examples.mjs 2>&1 | tee gate-examples.log; then
        echo "[gate:examples] GREEN — every documented snippet type-checks (count above)."
      else
        status=$?
        echo "[gate:examples] RED — a documented snippet no longer type-checks against real exports (2753-AC1/AC4; named above)."
        exit "$status"
      fi

#------------------------------------------------------------------------------
# gate:api-drift: diff the fresh symbols section (rebuilt from corpus:build's
# .reflection.json) against the committed corpus.json, and check the fresh reference
# pages (--pages .corpus-fresh) for stale ids and signatures. Reuses the reflection
# artifact, so there is no second TypeDoc run.
#------------------------------------------------------------------------------
gate:api-drift:
  extends: .docs-corpus
  image: ${NODE_IMAGE}
  needs:
    - dependencies
    - corpus:build
  allow_failure: false
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - gate-api-drift.log
  script:
    - |
      set -o pipefail
      if node docs/corpus/gates/gate-api-drift.mjs --pages .corpus-fresh 2>&1 | tee gate-api-drift.log; then
        echo "[gate:api-drift] GREEN — emitted API surface matches reality."
      else
        status=$?
        echo "[gate:api-drift] RED — documented API surface drifted from reality (2753-AC1/AC4; drifted symbol + stale page named above)."
        exit "$status"
      fi

#------------------------------------------------------------------------------
# gate:symbols: every documented symbol id and every glossary referent must resolve
# against the fresh reflection. Reuses corpus:build's reflection artifact, so there
# is no second TypeDoc run.
#------------------------------------------------------------------------------
gate:symbols:
  extends: .docs-corpus
  image: ${NODE_IMAGE}
  needs:
    - dependencies
    - corpus:build
  allow_failure: false
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - gate-symbols.log
  script:
    - |
      set -o pipefail
      if node docs/corpus/gates/gate-symbols.mjs 2>&1 | tee gate-symbols.log; then
        echo "[gate:symbols] GREEN — every documented symbol + glossary referent resolves."
      else
        status=$?
        echo "[gate:symbols] RED — dead documented symbol or dead glossary referent (2753-AC1/AC4, 3003-AC2; named above)."
        exit "$status"
      fi

#------------------------------------------------------------------------------
# gate:authorship: the authorship guard (FE-2950), in --pages mode (FE-3271). It
# checks the corpus.json and relations.json integrity pins, the provenance keys of
# the fresh pages in .corpus-fresh, and that no committed hand-authored page carries
# a "generated" key. It does not replay the emit against the committed pages: the
# MR's pages are on preview/mr-<iid>, which corpus:preview-check guards.
#------------------------------------------------------------------------------
gate:authorship:
  extends: .docs-corpus
  image: ${NODE_IMAGE}
  needs:
    - dependencies
    - corpus:build
  allow_failure: false
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - gate-authorship.log
  script:
    - |
      set -o pipefail
      if node docs/corpus/gates/gate-authorship.mjs --pages .corpus-fresh 2>&1 | tee gate-authorship.log; then
        echo "[gate:authorship] GREEN — fresh pages carry full provenance; corpus.json and relations.json pins match."
      else
        status=$?
        echo "[gate:authorship] RED — hand-edited generated file / broken integrity pin / provenance violation (2950-AC2/AC3/AC4; named above)."
        exit "$status"
      fi

#------------------------------------------------------------------------------
# corpus:preview-check (MR only, FE-3271): guard preview/mr-<iid> before the bot
# commits to it. From the second push on, it fails on any generated-partition change
# since the newest docs-bot commit and on a "generated" key on a hand-authored page.
# On the first push (no branch yet) it passes. On green it writes PREVIEW_LEASE_SHA
# (the branch SHA it read, or "none") as a dotenv report that corpus:emit leases on.
#------------------------------------------------------------------------------
corpus:preview-check:
  extends: .docs-corpus
  image: ${NODE_IMAGE}
  needs:
    - dependencies
  rules:
    - if: '$DOCS_CORPUS_CI_ENABLED != "true"'
      when: never
    - if: $SKIP_DOCS_CORPUS == "true"
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - docs/corpus/**/*
        - .gitlab-ci/docs-corpus.yml
  allow_failure: false
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - corpus-preview-check.log
    reports:
      dotenv: preview.env
  script:
    - sh etc/ci/mintlify-git-setup.sh
    - |
      set -o pipefail
      if node docs/corpus/gates/gate-authorship.mjs --check-preview \
          --sub docs/published-docs --remote origin \
          --branch "preview/mr-${CI_MERGE_REQUEST_IID}" --base develop \
          --lease-out preview.env 2>&1 | tee corpus-preview-check.log; then
        echo "[corpus:preview-check] GREEN — preview/mr-${CI_MERGE_REQUEST_IID} holds only docs-bot pages in the generated partition."
      else
        status=$?
        echo "[corpus:preview-check] RED — preview/mr-${CI_MERGE_REQUEST_IID} was hand-edited (file + commit named above). Revert it on the branch, or delete the branch, then push the MR again."
        exit "$status"
      fi

#------------------------------------------------------------------------------
# corpus:emit: publish the fresh pages from corpus:build. On an MR, commit them to
# preview/mr-<iid> as the docs bot (force-with-lease on corpus:preview-check's
# PREVIEW_LEASE_SHA). On develop, only fill the artifact paths FE-2949's
# publish/canary seam consumes. `needs` lists corpus:build, all four gates and the
# preview check, so GitLab skips this job when any of them fails (2753-AC2).
# corpus:preview-check is optional because develop pipelines do not have it.
#------------------------------------------------------------------------------
corpus:emit:
  extends:
    - .pnpm
    - .docs-corpus
  needs:
    - dependencies
    - corpus:build
    - gate:examples
    - gate:api-drift
    - gate:symbols
    - gate:authorship
    - job: corpus:preview-check
      optional: true
  allow_failure: false
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - docs/published-docs/developers/reference
      - docs/published-docs/developers/changelog
      - docs/published-docs/developers/corpus-version.json
      - corpus-emit.log
  script:
    - |
      if [ -n "${CI_MERGE_REQUEST_IID:-}" ]; then
        sh etc/ci/mintlify-git-setup.sh
      fi
    - |
      set -o pipefail
      if sh etc/ci/corpus-preview.sh publish \
          --sub docs/published-docs --remote origin \
          --iid "${CI_MERGE_REQUEST_IID:-}" --lease-sha "${PREVIEW_LEASE_SHA:-none}" \
          --pages .corpus-fresh --source "${CI_PROJECT_PATH}@${CI_COMMIT_SHORT_SHA}" 2>&1 | tee corpus-emit.log; then
        echo "[corpus:emit] GREEN — fresh generated partition published (preview branch on an MR, artifact only on develop)."
      else
        status=$?
        echo "[corpus:emit] RED — publish failed (a late commit on the preview branch rejects the lease; see log above)."
        exit "$status"
      fi

#==============================================================================
# POST-MERGE corpus self-heal (FE-2752, FE-2949).
#
# The per-MR lane above only runs on docs/corpus/** changes, so a code-only MR that
# renames an exported symbol never trips the gates. This job is the backstop: on
# every push to the default branch it regenerates the corpus and emitted tree, then
# pushes the result back so the docs stay in sync with no dev friction. It honours
# the same $SKIP_DOCS_CORPUS escape hatch as the lane above.
#
# It pushes twice, because the corpus spans two repos:
#   1. docs/published-docs/developers/** (emitted MDX) to the mintlify-docs
#      submodule's develop, over SSH with UPMIND_MINTLIFY_DOCS_DEPLOY_PRIVATE_KEY.
#      CI is the sole writer to this path, and force-with-lease guards it.
#   2. docs/corpus/corpus.json and the submodule pointer to this repo's develop,
#      over HTTPS with CORPUS_PUSH_TOKEN, pushed with -o ci.skip.
# Push the submodule first, then bump and push the pointer to its new SHA. Both
# commit messages carry [skip ci] so the docs commits don't re-trigger the code
# lanes. relations.json is a committed graphify input, not regenerated here.
#
# Gates-green (AC) holds without running the gates in this job: corpus source only
# lands on develop through gated MRs, so a deterministic regenerate can't add ungated
# content. Running the drift gates here would block the update it exists to make.
#
# Preview merge (FE-3271): before the refresh, the job reads the MR iid from the
# merge commit body ("See merge request …!<iid>"), merges mintlify-docs
# preview/mr-<iid> into develop and deletes it. A conflict in the generated partition
# takes the preview tree, because the refresh regenerates it. A conflict outside the
# partition or a rejected push keeps the branch and makes the job red, but the
# refresh still runs. A direct push or an MR with no preview branch skips the merge.
#
# Canary (AC): after pushing, if MINTLIFY_LLMS_URL is set, check the live llms.txt
# corpus_version against the build and fail on a mismatch. It skips until the URL is set.
#
# The dependencies artifact restores the submodule's files but not its .git, and a
# push needs real git metadata, so etc/ci/mintlify-git-setup.sh re-clones it.
#==============================================================================
corpus:post-merge-refresh:
  extends: .pnpm
  stage: test
  # Not interruptible: the post-merge drift backstop should run to completion
  # rather than be auto-cancelled by the next push (a later push re-runs it).
  interruptible: false
  needs:
    - dependencies
  variables:
    # Match corpus:build: build.mjs reads `git tag -l 'docs-v*'` and a bounded git log
    # for the changelog window, so a faithful refresh needs full history to match the
    # committed corpus byte for byte.
    GIT_DEPTH: 0
    # The emitted tree lives in the docs/published-docs submodule, so check it out so
    # emit can write into it and the drift check can see file-level changes.
    GIT_SUBMODULE_STRATEGY: recursive
    GIT_SUBMODULE_DEPTH: 1
    DOCS_CORPUS_CI_ENABLED: "true"
  rules:
    - if: '$DOCS_CORPUS_CI_ENABLED != "true"'
      when: never
    - if: $SKIP_DOCS_CORPUS == "true"
      when: never
    # Run on demand from the GitLab UI (CI/CD > Pipelines > Run pipeline): set
    # CORPUS_REFRESH_NOW=true. Add CORPUS_PUSH_DRY_RUN=true for a no-write probe.
    - if: $CI_PIPELINE_SOURCE == "web" && $CORPUS_REFRESH_NOW == "true"
    # Automatic post-merge refresh on the default branch.
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  allow_failure: false
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - docs/corpus/corpus.json
      - docs/published-docs/developers/reference
      - docs/published-docs/developers/changelog
      - docs/published-docs/developers/corpus-version.json
      - corpus-refresh.log
  script:
    - sh etc/ci/mintlify-git-setup.sh
    - |
      # CI pushes corpus.json to THIS repo with the write-scoped token. The submodule
      # pushes over SSH via the deploy key set up above. A dry-run does not need the token.
      if [ -z "${CORPUS_PUSH_TOKEN:-}" ] && [ "${CORPUS_PUSH_DRY_RUN:-false}" != "true" ]; then
        echo "[corpus:post-merge-refresh] RED — CORPUS_PUSH_TOKEN unset; cannot push corpus.json back."
        exit 1
      fi
      [ -n "${CORPUS_PUSH_TOKEN:-}" ] && export CORPUS_SUPER_PUSH_URL="https://oauth2:${CORPUS_PUSH_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
    - |
      # Merge preview/mr-<iid> into mintlify-docs develop, then regenerate + push
      # (corpus-push-back.sh, always run), then the canary. tee keeps the log
      # artifact. pipefail stops tee from masking the script's exit status.
      set -o pipefail
      sh etc/ci/corpus-preview.sh post-merge \
        --sub docs/published-docs --remote origin \
        --commit-message "${CI_COMMIT_MESSAGE}" 2>&1 | tee corpus-refresh.log
