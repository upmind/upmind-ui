# FE-2842 Tranche 0 — ESLint suppression-ledger convergence guard.
#
# The monorepo's eslint-suppressions.json ledger only applies when ESLint runs
# with cwd = repo root (its keys are root-relative). Every lint entrypoint is
# therefore routed through .claude/scripts/lint/eslint-workspace.mjs so root, `pnpm -r`
# and `pnpm --filter <pkg>` all resolve the SAME suppression state. This job runs
# .claude/scripts/lint/verify-lint-convergence.mjs, which fails if any managed package's
# lint script stops routing through that wrapper (i.e. reverts to `eslint .`,
# which silently ignores the ledger). It is deliberately NOT a full `pnpm -r lint`
# gate — burning down the remaining violations is later FE-2842 tranches.
lint:convergence:
  extends: .pnpm
  stage: test
  interruptible: true
  needs:
    - dependencies
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
  script:
    - pnpm lint:verify

# Real ESLint rule gate — runs the actual rules over the tree (unlike
# lint:convergence, which only checks the suppression-wrapper wiring).
#
# SCAFFOLDED, NOT YET ENFORCING: `allow_failure: true` means it runs and
# reports on every MR but does NOT block merge. It cannot block yet because
# the eslint-suppressions.json ledger has drifted — ~27 headless files carry
# pre-existing `@typescript-eslint/no-explicit-any` (etc.) violations that were
# never banked, and packages/types (a submodule) lints on its own bare eslint.
# Flip `allow_failure` to false to turn this into a hard gate ONCE the ledger
# burn-down lands (tracked in the FE-2842 ESLint-fixes issue). The scope-based
# variance-law rules (packages/headless/src/modules/**) are already green, so
# this MR's own plugin is not what's holding the gate open.
lint:eslint:
  extends: .pnpm
  stage: test
  interruptible: true
  allow_failure: true
  needs:
    - dependencies
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
  script:
    - pnpm -r lint
