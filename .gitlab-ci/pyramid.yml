# Testing-pyramid CI cadence (FE-2772, ADR 021 §"CI strategy per layer").
#
# ADR 021 layers each PR/branch/release run so a bug surfaces at the layer it
# lives in, and so the fast layers gate every push while the slow full suite
# stays a safety net. The four layers map to jobs as follows:
#
#   Layer        Job                 File                When it runs
#   ----------   -----------------   -----------------   --------------------------
#   Unit         unit:test           pyramid.yml (here)  every MR push + default br.
#   Integration  integration:test    pyramid.yml (here)  every MR push + default br.
#   E2E critical e2e:allure          e2e-allure.yml      MR → main/develop/@next
#   E2E full     e2e:full            e2e-allure.yml      nightly schedule + release tags
#
# The two E2E jobs live in e2e-allure.yml because they share the Playwright image,
# the qa-automation.local host mapping, and the per-branch Allure history cache.
# `e2e:allure` (the ~critical-journey subset that runs on develop-merge) is left
# BYTE-FOR-BYTE UNCHANGED per this issue's AC — the new work is `e2e:full`.
#
# Constraints honoured here (ADR 021 §Flakiness policy + this issue's AC):
#   - No GitLab-level `retry:` on any test job. The only retry is Playwright's
#     own `retries: 1` (playwright.config.ts). Adding CI retries would mask flake.
#   - Failures are layer-specific in dev-facing surfaces: each layer is its own
#     named job, so the MR pipeline widget shows *which layer* went red, not a
#     generic "tests failed". GitLab keeps each job's most recent run queryable
#     in the Pipelines/Jobs dashboard, and job logs are retained per the existing
#     policy (the pre-existing test jobs — `(headless) test`, `lint:features`,
#     `lint:quarantine` — likewise rely on job logs rather than declared
#     artefacts; `e2e:full` additionally publishes an Allure report artefact).

#------------------------------------------------------------------------------
# Unit — every PR push, blocks merge, ADR 021 target < 60s.
#
# `pnpm test:unit` (root) fans out to every workspace package's own `test:unit`
# script via `pnpm -r test:unit`, mirroring the existing root `test`/`lint`
# scripts. Today only `packages/headless` defines `test:unit` (its Vitest `unit`
# project); as more packages grow a unit project they join automatically with no
# CI change. The HTTP layer is fully stubbed in unit tests, so this job needs no
# staging network and no submodules beyond what `dependencies` already provides.
#------------------------------------------------------------------------------
unit:test:
  extends: .pnpm
  stage: test
  interruptible: true
  needs:
    - dependencies
  rules:
    - if: $SKIP_UNIT_TESTS == "true"
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - pnpm test:unit

#------------------------------------------------------------------------------
# Integration — every PR push, blocks merge, ADR 021 target < 5min.
#
# PLACEHOLDER (permitted by this issue's AC). The pyramid-level `pnpm
# test:integration` command and its cross-package, MSW-replay integration
# project are the deliverable of Story B (FE-2773), which has NOT landed —
# "standing up the integration Vitest project itself" is explicitly out of this
# issue's scope. This job is therefore a documented no-op that keeps the layer's
# slot (and its blocking position in the pipeline) reserved: when FE-2773 lands,
# swap the echo below for `pnpm test:integration` and the gate goes live with no
# other change.
#
# No coverage is lost in the interim: `packages/headless` already owns an `int`
# Vitest project (`*.int.test.ts`), and those integration tests continue to run
# today inside the `(headless) test` job (`pnpm --filter headless test`).
#
# Kept deliberately cheap — a pure echo needs neither the `dependencies`
# artefact nor the submodules (mirrors `lint:features`).
#------------------------------------------------------------------------------
integration:test:
  image: ${NODE_IMAGE}
  stage: test
  interruptible: true
  needs: []
  variables:
    GIT_SUBMODULE_STRATEGY: none
  rules:
    - if: $SKIP_INTEGRATION_TESTS == "true"
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    # Literal block: the ': ' inside these echo strings would otherwise be
    # parsed as YAML mapping syntax, turning script entries into maps and
    # invalidating the job (script must be strings). A '|' block keeps them text.
    - |
      echo "TODO: integration layer blocked on Story B (FE-2773)."
      echo "      The pyramid-level 'pnpm test:integration' command + its"
      echo "      cross-package MSW-replay project ship with FE-2773; this job"
      echo "      is a placeholder until then (ADR 021 §CI strategy per layer)."
      echo "      Interim: headless '*.int.test.ts' still run under '(headless) test'."
      exit 0
