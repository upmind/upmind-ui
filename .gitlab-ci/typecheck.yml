# Project-reference type gate: the only check that catches a cross-package import cycle.
typecheck:packages:
  extends: .pnpm
  stage: test
  interruptible: true
  needs:
    - dependencies
  rules:
    - if: $SKIP_TYPECHECK == "true"
      when: never
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_PIPELINE_SOURCE == 'web'
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
  allow_failure: false
  script:
    - pnpm exec vue-tsc -b
