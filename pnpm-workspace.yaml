packages:
  - "docs"
  - "packages/*"
  - "playgrounds/*"
  - "apps/*"
  - "tests/fixtures"
  - "tests/journeys"
  # Design System (git submodule, branch ui-migration) — only the two consumed packages join
  # this workspace, NOT design-system/packages/* (excludes the DS's `mcp`) and NOT the DS's own
  # apps/*. The DS's nested pnpm-workspace.yaml is ignored; pnpm reads only this root. Their
  # `catalog:` specifiers resolve against this catalog, which already carries every entry.
  - "design-system/packages/ui"
  - "design-system/packages/tokens"
allowBuilds:
  '@parcel/watcher': true
  '@sentry/cli': true
  core-js-pure: true
  esbuild: true
  msw: false
  protobufjs: true
  re2: true
  sharp: true
  unrs-resolver: true
  vue-demi: true
  workerd: true

# Dedupe @internationalized/date to one copy — reka-ui's peer resolution otherwise
# pulls a second (older) version, so the vendored lib's CalendarDate and reka-ui's
# DateValue become different types and the calendar/date-picker typecheck fails.
overrides:
  '@internationalized/date': ^3.12.2
  # The checkout submodules (apps/velia, apps/hosting) still declare the retired
  # @upmind-automation/{upmind-ui,tokens} workspace deps; rewrite them to the
  # design-system packages here so their repos need no companion commit. Their
  # own vite/tsconfig path aliases stay stale until each app's mirror pass.
  '@upmind-automation/upmind-ui': 'workspace:@upmind/ui@*'
  '@upmind-automation/tokens': 'workspace:@upmind/tokens@*'
  # One vue for the whole workspace — apps/cart's tree had a stale 3.5.25 beside
  # 3.5.39, and refs branded by one copy's unique symbols don't unwrap under the
  # other's types: every DS ui template went red in cross-package type checks.
  vue: 3.5.39

# Catalog mirrored from upmind-design-system (FE-2884) — consumed only by the design-system
# submodule's @upmind/{ui,tokens}; existing packages keep their direct pins (zero blast radius).
catalog:
  vue: ^3.5.38
  vue-router: ^5.1.0
  reka-ui: ^2.10.3
  tailwindcss: ^4.3.0
  '@tailwindcss/vite': ^4.3.0
  tw-animate-css: ^1.4.0
  vite: ^8.0.16
  vite-plus: ^0.1.24
  vitest: ^4.1.8
  '@vitest/browser-playwright': ^4.1.8
  playwright: ^1.60.0
  '@vitejs/plugin-vue': ^6.0.7
  typescript: ~5.9.3
  vue-tsc: ^3.3.4
  class-variance-authority: ^0.7.1
  clsx: ^2.1.1
  tailwind-merge: ^3.6.0
  lucide-vue-next: ^1.0.0
  '@lordicon/element': ^1.11.0
