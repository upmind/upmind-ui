variables:
  NODE_IMAGE: node:24.4.1-alpine3.22
  GIT_STRATEGY: clone
  GIT_SUBMODULE_STRATEGY: recursive
  GIT_SUBMODULE_FORCE_HTTPS: true
  # NOTE: Stop Gitlab-CI automatically fetching GitHub repos as we need extra auth.
  # All three github.com submodules are excluded from GitLab's auto (HTTPS) fetch and
  # instead fetched over SSH in the `dependencies` job via per-repo deploy keys
  # (packages/types, packages/ui, and docs/published-docs / mintlify-docs — FE-2752).
  GIT_SUBMODULE_PATHS: ":(exclude)packages/types :(exclude)packages/ui :(exclude)docs/published-docs"
  INTERNAL_NPMRC: |
    @upmind-automation:registry=https://git.upmind.io/api/v4/projects/105/packages/npm/
    //git.upmind.io/api/v4/projects/105/packages/npm/:_authToken=${CI_JOB_TOKEN}
  SLACK_NOTIFY_IMAGE: 391282194726.dkr.ecr.eu-west-1.amazonaws.com/upmind/slacker:main-6574f255
  GOOGLE_APPLICATION_CREDENTIALS: /tmp/credentials.json

stages:
  - dependencies
  - test
  - build
  - deploy
  - stop
  - publish internal
  - publish external

.pnpm:
  image: ${NODE_IMAGE}
  before_script:
    - corepack enable
    - corepack prepare pnpm@latest --activate
    - pnpm --version

include:
  - local: .gitlab-ci/cart.yml
  - local: .gitlab-ci/headless.yml
  - local: .gitlab-ci/pyramid.yml
  - local: .gitlab-ci/features.yml
  - local: .gitlab-ci/lint.yml
  - local: .gitlab-ci/e2e-allure.yml
  - local: .gitlab-ci/quarantine.yml
  - local: .gitlab-ci/docs-corpus.yml
  - local: .gitlab-ci/storybook.yml
    rules:
      - changes:
          paths:
            - ./playgrounds/storybook/**

      - if: $CI_FORCE_STORYBOOK == "true"

workflow:
  auto_cancel:
    on_new_commit: interruptible

  rules:
    # Prefer MR pipelines; fall back to branch pipelines; but no duplicates!
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

#------------------------------------------------------------------------------
# Shared jobs
#------------------------------------------------------------------------------

dependencies:
  extends: .pnpm
  stage: dependencies
  interruptible: true

  cache:
    - key:
        files:
          - package.json
          - pnpm-lock.yaml
      paths:
        - node_modules
        - playgrounds/storybook/node_modules
        - apps/cart/node_modules
        - apps/cart-nuxt/node_modules
        - apps/velia/node_modules
        - apps/webcentral/node_modules
        - apps/hosting/node_modules
        - packages/headless/node_modules
        - packages/client-vue/node_modules
        - packages/icons/node_modules
        - packages/i18n/node_modules
        - docs/node_modules

  artifacts:
    when: on_success
    access: all
    untracked: true
    expire_in: "1 day"
    paths:
      - node_modules
      - playgrounds/storybook/node_modules
      - apps/cart/node_modules
      - apps/cart-nuxt/node_modules
      - apps/velia/node_modules
      - apps/webcentral/node_modules
      - apps/hosting/node_modules
      - packages/headless/node_modules
      - packages/client-vue/node_modules
      - docs/node_modules

      - packages/types
      - packages/ui
      - docs/published-docs
  script:
    - apk --no-cache add git openssh-client bash
    - |
      mkdir ~/.ssh || true

      echo "${UPMIND_TYPES_DEPLOY_PRIVATE_KEY}" > ~/.ssh/id.upmind-types
      echo "${UPMIND_UI_DEPLOY_PRIVATE_KEY}" > ~/.ssh/id.upmind-ui
      echo "${UPMIND_MINTLIFY_DOCS_DEPLOY_PRIVATE_KEY}" > ~/.ssh/id.mintlify-docs

      cat <<EOF > ~/.ssh/config
      Host *
        StrictHostKeyChecking no

      Host github-upmind-types
        User git
        Hostname github.com
        Identityfile ~/.ssh/id.upmind-types

      Host github-upmind-ui
        User git
        Hostname github.com
        Identityfile ~/.ssh/id.upmind-ui

      Host github-mintlify-docs
        User git
        Hostname github.com
        Identityfile ~/.ssh/id.mintlify-docs
      EOF

      cat <<EOF > ~/.gitconfig
      [url "github-upmind-ui:upmind/upmind-ui"]
        insteadOf = git@github.com:upmind/upmind-ui

      [url "github-upmind-types:upmind/types"]
        insteadOf = git@github.com:upmind/types

      [url "github-mintlify-docs:upmind/mintlify-docs"]
        insteadOf = git@github.com:upmind/mintlify-docs
      EOF

      chmod 700 ~/.ssh
      chmod 600 ~/.ssh/id*

    - git config --global --add safe.directory '*'
    - git submodule update --init --recursive
    - pnpm install
    - pnpm --filter types install
    - pnpm --filter types build

.check version:
  stage: build
  image: ${NODE_IMAGE}
  rules:
    - if: $CI_COMMIT_TAG
  before_script:
    - apk add jq
  script: |
    set -u
    cd ${ROOT_DIR}

    package_version=$(jq -r '.version' package.json)
    tag_version=$(echo "${CI_COMMIT_TAG}" | grep -Eow 'v(\d+(\.\d+)*)')

    if [ "v${package_version}" != "${tag_version}" ]; then
      cat <<EOF >&2
      ERROR: Package version and commit tag do not match

      Package version: v${package_version}
      Commit tag: ${tag_version}
    EOF
      exit 1
    fi
