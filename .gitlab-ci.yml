variables:
  NODE_IMAGE: node:20.11.0-alpine3.19

stages:
  - dependencies
  - build
  - test
  - deploy
  - stop

include:
  - local: .gitlab-ci/storybook.yml
    rules:
      - changes:
          paths:
            - ./playgrounds/storybook/**

      - if: $CI_FORCE_STORYBOOK == "true"

  - local: .gitlab-ci/vitepress.yml

workflow:
  rules:
    # Prefer MR pipelines; fall back to branch pipelines; but no duplicates!
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

#------------------------------------------------------------------------------
# Shared jobs
#------------------------------------------------------------------------------

dependencies:
  stage: dependencies
  image: ${NODE_IMAGE}

  cache:
    - key:
        files:
          - package.json
          - package-lock.json
      paths:
        - node_modules

  artifacts:
    when: on_success
    access: all
    expire_in: "1 day"
    paths:
      - node_modules

  script:
    - npm clean-install --include dev
