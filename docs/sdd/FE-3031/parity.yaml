  - id: R04
    capability: "unifiableCount(clientId) - per-client cached consolidatable count, served WITHOUT disturbing the list the client is reading"
    legacy: "oracle:37-43 (getter unifiableCount over the dedicated scope key $unifiable_count::${clientId}, reading state[scope].total) + oracle:574-592 (action getConsolidatableTotal, which fetches it; its limit:'count' is at oracle:581)"
    disposition: Renamed
    delivered_by: "AC2 - useInvoices().useMeta().consolidatableCount (useInvoices.meta.ts:80-83) over its OWN dedicated query loadConsolidatableCount (invoices.services.ts:415-446), seeded by consolidatableCountCriteria (invoices.schemas.ts:364-371) and kept on the target client by trackClientIdFilter (invoices.services.ts:443)"
    notes: >-
      RE-DISPOSITIONED 2026-09-08 after the Verify-stage ABSENT #2 finding
      (verify.md:157-172).

      WAS: "Absorbed-by / AC2 - the Consolidatable criteria preset over
      loadList, whose total serves the notice and the on-demand CTA count /
      No capability lost." That graded the row on a criteria preset existing
      rather than on the oracle's actual capability. The oracle answers the
      count from a DEDICATED per-client scope (oracle:37-43) and never touches
      the list; the then-landed filterConsolidatable() reached the count ONLY
      by query.setCriteria() on the ONE list query the scope owns, and
      generateScopeKey keys the collection on (module, actor, context) alone,
      so two .as(CLIENT) calls return the same registry instance. The notice
      count and the client's own list therefore could not coexist - which is
      precisely what AC2's "with the total count available for the
      consolidation notice" asks for. The capability was narrowed and the row
      hid the narrowing behind "No capability lost".

      WHAT LANDS NOW - two independent readers, each with its own receipt.
      (1) COUNT - loadConsolidatableCount() mints its OWN list()
      (invoices.services.ts:415-446) with its own query key
      ["invoices","consolidatable_count",{client}] (:427) and its own criteria
      object (:423-426). It is minted once per scope beside the list query
      (useInvoices.ts:56) and read by meta.consolidatableCount
      (useInvoices.meta.ts:80-83). A request gate
      (requestConsolidatableCount, invoices.services.ts:521-523) keeps it
      un-issued until something reads the count.
      (2) LIST - filterConsolidatable() still calls query.setCriteria() on the
      list query (useInvoices.actions.ts:157-161), retained for the genuine
      "narrow MY visible list" case the oracle also offers
      (consolidatableCriteria, invoices.schemas.ts:343-353 - filters only, no
      pagination override).
      The two share no criteria object and no query key, so reading the count
      cannot mutate the visible list. They coexist.

      MECHANISM CORRECTED 2026-09-08 (2nd correction), Review blocker B3. This
      row said meta.consolidatableCount "returns
      consolidatableCountQuery.total.value - the server's reported total". IT
      DOES NOT, AND MUST NOT: a bare .total read is pinned at 0 forever.
      ListQuery.total is a computed over a ref(0) that self-updates from the
      response only as a SIDE EFFECT of reading .pagination/.meta, so a
      dedicated count query that reads only .total never triggers the update.
      The landed code returns consolidatableCountQuery.pagination.value.total
      (useInvoices.meta.ts:80-83), with the full argument in the @decision at
      useInvoices.meta.ts:46-61 that hasUnpaid (:63-66) shares. Both fields
      already exist on every ListQuery, so this picks the one that resolves and
      is NOT a query-module change (operator ruling 2026-09-08, "do not chnage
      any query stuff"). The description this row carried was the mechanism an
      EARLIER repair had already replaced - the row, not the code, was stale.
      The SAME correction is now applied to the collection context's published
      total member (useInvoices.context.ts:92, @decision :79-91), which
      previously published the pinned-at-zero query.total; design.md's context
      table and requirements.md AC2 are updated to describe pagination.total in
      both places.

      WHY Renamed AND NOT Absorbed-by: the capability is no longer folded into
      another capability - it stands as its own read. What changed is its NAME
      and SURFACE: the oracle's getter+action pair (unifiableCount +
      getConsolidatableTotal) becomes the single member
      useMeta().consolidatableCount, and the per-client cache partition the
      oracle's bespoke $unifiable_count::${clientId} scope key did by hand is
      the { client: clientId } segment of the count query's key. Same
      capability, new surface = Renamed.

      TWO MECHANISM DIVERGENCES RECORDED, neither capability-bearing.
      (a) The count read sends pagination.limit: 1, not the oracle's
      limit:"count" (oracle:581) - the same divergence, for the same reason, as
      R01 records; the withPageWindow / useValidation mechanism and the
      operator ruling behind it are written out at requirements.md AC10's
      "Oracle divergence" note. The count is still the server's own total.
      (b) CLOSED 2026-09-08 (2nd correction) - this divergence no longer
      exists. It read: "consolidatableCountCriteria(clientId.value) is
      evaluated once at mint, so in the client x self case the criteria's
      client_id may still be nil at mint and that filter drops out." The
      mint-time seed is still there (invoices.services.ts:425) but
      trackClientIdFilter (:443, helper :137-152) now re-applies client_id on
      every change of the resolved target with { immediate: true }, so a
      self-scope whose activeUser id arrives after construction - or changes on
      a session switch - gets the column too. The cache partition still comes
      from the reactive { client: clientId } segment of the query key (:427).

