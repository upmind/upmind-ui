    delivered_by: "AC8 - Payment['isAwaitingClient'], requiring payments.gateway in the loadOne include set"
    notes: "The oracle has TWO pending predicates; the original AC8 named one. Dropping the second collapses 'awaiting the client's bank transfer' into plain 'pending'. Also cross-checked against the BE-computed pending_payment_method (invoices.ts:80-86, requires with=last_payment_log) which is now requested."

  - id: R04
    capability: "unifiableCount(clientId) - per-client cached consolidatable count"
    legacy: "oracle:37-43 (scope key $unifiable_count::${clientId}, reads state[scope].total)"
    disposition: Absorbed-by
    delivered_by: "AC2 - the Consolidatable criteria preset over loadList, whose total serves the notice and the on-demand CTA count"
    notes: "Absorbed rather than dropped: the oracle's two count surfaces (unifiableCount :37-43 and getConsolidatableTotal :574-593) answer the same question with different caches. One declared criteria preset over the one list query serves both, and the query key partitions per resolved client - which is what unifiableCount's bespoke scope key was doing by hand. No capability lost."

