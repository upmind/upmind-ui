    capability: "unifiableCount(clientId) - per-client cached consolidatable count, served WITHOUT disturbing the list the client is reading"
    legacy: "oracle:37-43 (getter unifiableCount over the dedicated scope key $unifiable_count::${clientId}, reading state[scope].total) + oracle:574-592 (action getConsolidatableTotal, which fetches it; its limit:'count' is at oracle:581)"
