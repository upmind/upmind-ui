    disposition: Direct
    delivered_by: "The loadOne include set named in design.md - the existing 17 relations are the FLOOR and may not shrink; category, payments.gateway, payments.payment_type, payment_details, gateway, client.parent_client_config, last_payment_log, address, address.country are added"
