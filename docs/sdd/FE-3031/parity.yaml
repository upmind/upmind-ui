# ---------------------------------------------------------------------------
# ARMS DETERMINATION (per-layer)
#
# Derived mechanically from the cells above, per clause 3 of the variance law
# (.claude/rules/code-composables.companion.md:60-62): an .{actor}.ts arm exists
# ONLY where an actor has members exclusive to it, or overriding the shared
# implementation, measured against the shared factory.
#
# DERIVATION: after the staff deprecation the table has exactly ONE non-dropped
# actor - `client`. With one resolving actor there is no second implementation to
# diverge from and no member any actor holds exclusively, so no layer can earn an
# arm. The client x self / client x client difference is a CONTEXT axis, not an
# actor axis, and contexts are resolved inside the shared services factory by the
# resolveClientId seam - variance-law clause 4 (.as('self') resolution owned by
# the scope builder). Live receipt for exactly this shape:
# client-email-history.services.ts:205-207 - "_scopeActor is unused today - with a
# single resolving actor (client) in both matrices (D6), there is no per-actor
# member to select."
#
# Per clause 2 (fresh modules start armless) NO .{actor}.ts file is scaffolded.
# Every layer keeps its scopeActor parameter so a future arm needs no call-site
# change, and every scopedX() switch ships with only its `default:` case.
# ---------------------------------------------------------------------------
arms:
  services:
    earned: none
    earning_actors: []
    reason: "One non-dropped actor (client). The per-context divergence is resolveClientId(scopeContext) inside the shared factory, not a per-actor member. Parity rows: client x self + client x client (both Direct, one actor)."
  actions:
    earned: none
    earning_actors: []
    reason: "No action is exclusive to, or overrides for, any actor - one actor remains. Parity rows: client x self + client x client."
  context:
    earned: none
    earning_actors: []
    reason: "No context-layer member is per-actor. Row attribution (R02) is per-ROW data mapped in the mappers layer, not a per-actor context member. Parity rows: client x client (R02)."
  meta:
    earned: none
    earning_actors: []
    reason: "No meta flag is exclusive to an actor. isSettleable (R02) is per-row, not per-actor. Parity rows: client x self + client x client."
  schemas:
    earned: none
    earning_actors: []
    reason: "ONE useQuerySchema() serves both cells - the client_id column is the same declared column whichever client fills it. No actor sees a different filter, sort or pagination vocabulary. Parity rows: client x self + client x client."

# ---------------------------------------------------------------------------
# CAPABILITY ROWS — the ten rows carried forward from the Research stage.
# Each carries a disposition. Undispositioned row count = 0.
# ---------------------------------------------------------------------------
rows:
  - id: R01
    capability: "hasUnpaid - unpaid-existence read: does this client owe anything at all, answered without loading the list"
    legacy: "oracle:553-573 (limit:'count' at :559, filter[status.code]=unpaidStatuses at :560, optional filter[client_id] at :561-563, storeData:false, returnData:false, returns response.total > 0 at :572)"
    disposition: Direct
    delivered_by: "AC10 - loadUnpaidExistence() (invoices.services.ts:259-283) over its OWN query key ['invoices','unpaid_existence',{client}] (:268), seeded by UNPAID_EXISTENCE_CRITERIA (invoices.schemas.ts:329-332), read by meta.hasUnpaid (useInvoices.meta.ts:37-40) as total > 0"
    notes: >-
      Was named by NO original AC and excluded by no Out-of-Scope clause. Added
      as a requirement rather than dispositioned away - the JTBD's first noun is
      'unpaid amount'.

      MECHANISM DIVERGENCE RECORDED 2026-09-08 (capability unchanged, so the
      disposition stays Direct - Direct grades the capability, and the
      divergence is stated rather than hidden): the oracle asks for the total
      with limit:"count" and no rows (oracle:559); this module sends
      pagination.limit: 1 and applies the oracle's OWN total>0 semantics
      (oracle:572) to the response. The sentinel cannot be spelled through
      list()'s validated criteria channel for any module - withPageWindow
      (packages/headless/src/modules/query/query.utils.ts:603-627) merges a
      hard-coded integer limit (:614-618) beneath every module's declared
      pagination schema, and useValidation's safeValue dispatches on that merged
      type alone without consulting oneOf
      (packages/headless/src/utils/useValidation.ts:539-542), so "count" is
      non-finite, is discarded, and PAGINATION.limit = 10 (query.utils.ts:72) is
      substituted before the model reaches the wire. Fixing that is a
      query-core change the operator withdrew on 2026-09-08, verbatim: "do not
      chnage any query stuff". Full statement of the divergence, its reason and
      its capability argument: requirements.md AC10's "Oracle divergence" note.
      The capability - a dedicated read answering "do I owe anything at all"
      from the server's reported total, never from the visible row array - is
      unchanged; only the page window differs.

  - id: R02
    capability: "Co-mingled list attribution - belongsToChildOfClient + belongsToDelegate"
    legacy: "oracle:126-133 (client.parent_client_config.parent_client_id vs the reading client); :134-137 (delegate_related, gated child-first); consumed at invoiceRowItem.vue:322-341 and invoiceStatusMsg.vue:118-124 (canPay false for a delegated invoice)"
    disposition: Direct
    delivered_by: "AC13 - Invoice['attribution'] { isOwn, isChildOfClient, isDelegated, isSettleable } mapped from the invoice payload"
    notes: "Was named by NO original AC and is correctness-bearing: without it a client is offered 'pay' on an invoice it may not settle. Shipping the client x client cell without this is the FE-2824 shape - right matrix entry, no capability. Needs NO dependency on FE-3036: both inputs are on the invoice payload (invoices.ts:63; clients.ts:74 -> :179)."

  - id: R03
    capability: "hasPendingPaymentInstructions - AWAITING_CLIENT gateway discrimination"
    legacy: "oracle:93-101 (payment.pending && payment.gateway?.type === GatewayTypes.AWAITING_CLIENT), distinct from hasPendingPayments oracle:90-92"
    disposition: Direct
    delivered_by: "AC8 - Payment['isAwaitingClient'], requiring payments.gateway in the loadOne include set"
    notes: "The oracle has TWO pending predicates; the original AC8 named one. Dropping the second collapses 'awaiting the client's bank transfer' into plain 'pending'. Also cross-checked against the BE-computed pending_payment_method (invoices.ts:80-86, requires with=last_payment_log) which is now requested."

  - id: R04
    capability: "unifiableCount(clientId) - per-client cached consolidatable count, served WITHOUT disturbing the list the client is reading"
    legacy: "oracle:37-43 (getter unifiableCount over the dedicated scope key $unifiable_count::${clientId}, reading state[scope].total) + oracle:574-592 (action getConsolidatableTotal, which fetches it; its limit:'count' is at oracle:581)"
    disposition: Renamed
    delivered_by: "AC2 - useInvoices().useMeta().consolidatableCount (useInvoices.meta.ts:51-54) over its OWN dedicated query loadConsolidatableCount (invoices.services.ts:296-323), seeded by consolidatableCountCriteria (invoices.schemas.ts:364-371)"
    notes: >-
      RE-DISPOSITIONED 2026-09-08 after the Verify-stage ABSENT #2 finding
      (verify.md:157-172).

      WAS: "Absorbed-by / AC2 - the Consolidatable criteria preset over
      loadList, whose total serves the notice and the on-demand CTA count /
      No capability lost." That graded the row on a criteria preset existing
      rather than on the oracle's actual capability. The oracle answers the
      count from a DEDICATED per-client scope (oracle:37-43) and never touches
      the list; the then-landed filterConsolidatable() reached the count ONLY
      by query.setCriteria() on the ONE list query the scope owns, and
      generateScopeKey keys the collection on (module, actor, context) alone,
      so two .as(CLIENT) calls return the same registry instance. The notice
      count and the client's own list therefore could not coexist - which is
      precisely what AC2's "with the total count available for the
      consolidation notice" asks for. The capability was narrowed and the row
      hid the narrowing behind "No capability lost".

      WHAT LANDS NOW - two independent readers, each with its own receipt.
      (1) COUNT - loadConsolidatableCount() mints its OWN list()
      (invoices.services.ts:296-323) with its own query key
      ["invoices","consolidatable_count",{client}] (:308) and its own criteria
      object (:303-307). It is minted once per scope beside the list query
      (useInvoices.ts:52) and read by meta.consolidatableCount
      (useInvoices.meta.ts:51-54), which returns
      consolidatableCountQuery.total.value - the server's reported total, never
      a row-array length. A request gate (requestConsolidatableCount,
      invoices.services.ts:398-400) keeps it un-issued until something reads
      the count.
      (2) LIST - filterConsolidatable() still calls query.setCriteria() on the
      list query (useInvoices.actions.ts:157-161), retained for the genuine
      "narrow MY visible list" case the oracle also offers
      (consolidatableCriteria, invoices.schemas.ts:343-353 - filters only, no
      pagination override).
      The two share no criteria object and no query key, so reading the count
      cannot mutate the visible list. They coexist.

      WHY Renamed AND NOT Absorbed-by: the capability is no longer folded into
      another capability - it stands as its own read. What changed is its NAME
      and SURFACE: the oracle's getter+action pair (unifiableCount +
      getConsolidatableTotal) becomes the single member
      useMeta().consolidatableCount, and the per-client cache partition the
      oracle's bespoke $unifiable_count::${clientId} scope key did by hand is
      the { client: clientId } segment of the count query's key. Same
      capability, new surface = Renamed.

      TWO MECHANISM DIVERGENCES RECORDED, neither capability-bearing.
      (a) The count read sends pagination.limit: 1, not the oracle's
      limit:"count" (oracle:581) - the same divergence, for the same reason, as
      R01 records; the withPageWindow / useValidation mechanism and the
      operator ruling behind it are written out at requirements.md AC10's
      "Oracle divergence" note. The count is still the server's own total.
      (b) consolidatableCountCriteria(clientId.value) is evaluated once at mint
      (invoices.services.ts:306), so in the client x self case - where the id
      arrives from the session's activeUser rather than from a .for() context -
      the criteria's client_id may still be nil at mint and that filter drops
      out. The request stays client-scoped by the reading client's own bearer
      token, and the CACHE partition stays per-client because the query key
      carries the reactive { client: clientId } computed (:308). The
      client x client case is unaffected: scopeContext.id resolves
      synchronously before the mint.

