    delivered_by: "AC11 - summary.balance + summary.balanceFormatted, exposed DISTINCTLY from summary.unpaidAmount"
    notes: "Was named by no original AC. AC1 (unpaid amount) meets AC5 (consolidation) here and the current VM (invoices.types.ts:32-43) maps neither balance nor the divergence - so a consolidated invoice's displayed remainder is wrong today. The module never silently picks one of the two numbers; both are exposed and the consumer chooses."

