    signoff: "op:dom@upmind.com:2026-09-01"
    notes: "No Linear issue. Stated in code as INVOICES_SCOPE_MATRIX[STAFF] = null as never with the ruling in its docblock."

  - id: R08
    capability: "partial_amount_to_credit - the BARE numeric field (amount queued for credit)"
    legacy: "invoices/docs/foundation.md:30 and :192 document it; oracle exposes it on the invoice payload"
    disposition: Dropped-with-issue-reference
    reason: "The bare field is ABSENT from packages/types - only partial_amount_to_credit_converted (packages/types/src/models/invoices.ts:75) and _formatted (:76) are declared; a grep for the bare name across packages/types/src returns zero. packages/types is a git SUBMODULE and outside this run's write lane, so adding it is not available to this run. AC5 IS STILL MET: its capability is 'a client can see how much is queued for credit', and the _converted (display-currency numeric) plus _formatted (locale string) variants deliver exactly that quantity - the bare field is the same amount in the invoice's own currency. This is a field-variant deferral, NOT a capability narrowing, which is why it is not a HALT: a HALT would be warranted only if no served variant carried the quantity."
    signoff: "op:dom@upmind.com:2026-09-01"
    tracker: "FE-3031-TYPES-PARTIAL-AMOUNT-TO-CREDIT (Linear issue to be filed against packages/types by the operator; the submodule change is outside this story's write lane)"
