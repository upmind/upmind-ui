n dispositioned away. withDurableClientId is its structural fix: it closes BOTH doors at the one shared handle instead of patching one preset, so a future preset cannot re-open the defect. blocked_by REMOVED 2026-09-08 on the landed code plus the green read-back above. ADDED 2026-09-09 (AC17/AC18, appended to the issue mid-run). AC18 is the one that touches this cell's mechanism: narrowing to a contract product is a filters-branch write, so it is exactly the H1 class, and AC18's read-back therefore requires the target client's id to still be on the request after the product narrowing - withDurableClientId (:195-215) is what makes that hold, and the assertion is stated rather than assumed. AC17 does NOT retarget: GET api/invoices/{id}/download is addressed by INVOICE id and carries no client filter, so on a .for(client, X) scope this cell shows up only as the isAddressable gate (invoices.services.ts:519) and the credential remains the READING client's own session bearer token (:524-531) - no impersonation header, no token swap. Stated so nobody reads a silent retarget into a download. The Direct disposition and every receipt above are unchanged."

