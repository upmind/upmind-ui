        A-staff-onbehalf and A-guest-self are Dropped-with-Linear-issue; A-client-onbehalf and
        A-guest-onbehalf are NOT-SUPPORTED. So exactly ONE actor (client) reaches any layer, and
        an arm is by definition a per-actor divergence. A single resolving actor cannot diverge
        from itself, so no layer earns an arm.
        UNCHANGED by the one-resolving-cell revert (open_tensions[T1]): that revert removed a
        second CONTEXT for the same actor, and a context is not an actor, so it could never have
        earned an arm. The resolving-ACTOR count was and remains one.
