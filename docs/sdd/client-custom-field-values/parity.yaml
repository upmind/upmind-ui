    # -------------------------------------------------------------------------
    # ARMS — derived mechanically from the table above (variance law clause 3)
    # -------------------------------------------------------------------------
    arms:
      determination_rule: >-
        Clause 3: an arm exists ONLY where a scope has members exclusive to it, or overriding
        the shared implementation — i.e. a per-actor route, capability gate, or member at that
        layer. Per the layer-scope note in code-composables.companion.md this applies to all
        five layers, not only those with an existing in-tree exemplar.
