        earning_rows: []
        cites: "rows A-staff-* / A-guest-* / A-client-onbehalf do not resolve => no per-actor route; A-client-self is the only route"
      actions:
        arm: none
        earning_rows: []
        cites: "row A-client-self is the only resolving cell — no second actor to hold an exclusive member"
      context:
        arm: none
        earning_rows: []
        cites: "row A-client-self is the only resolving cell — one projection"
      meta:
        arm: none
        earning_rows: []
        cites: "row A-client-self is the only resolving cell — no per-actor read-state exists"
      schemas:
        arm: none
        earning_rows: []
        cites: >-
          row A-client-self is the only resolving cell — one schema per definition set; the only
          narrowing is filterFields, which is a caller argument, not an actor
      files_created: []   # zero *.{actor}.ts files anywhere in this module

