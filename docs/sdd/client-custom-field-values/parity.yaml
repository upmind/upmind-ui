          different session, not a retargeted request on the parent's session. No customer-area
          route reads or writes another client's custom fields
          (views/client/account/profile/index.vue:17-25 passes only the session's own :client).
        surface_check: >-
          Not merely undelivered — UNNAMEABLE. No context type in either of this module's
          matrices is `client`, so `.for('client', id)` does not compile. See design.md 2.2.
        acs: []
