# Raised by the planner, ruled by the conductor. Kept so the reasoning survives the decision.
open_tensions:
  - id: T1
    status: RESOLVED
    resolved_by: "conductor ruling, 2026-08-10"
    resolved_to: >-
      STRICTLY ONE resolving cell per composable: client x self. Rows A-client-onbehalf and
      B-client-onbehalf are NOT-SUPPORTED. The two retarget acceptance criteria (formerly numbered
      twenty-six and fifty-eight) are DELETED — those ids are now unused and must not be reissued.
    subject: "R1's literal 'client x self ONLY' vs R1's own drop enumeration + R7's identity seam"
    planner_position_as_raised: >-
      R1 says "Cells: client x self ONLY", and in the same breath scopes the drops to
      "staff/guest surfaces". Every named drop (Module A's four, Module B's D1-D13) is a
      staff or guest capability; not one is a client-actor drop. The planner additionally
      believed R7's identity seam needed a second branch to stay live, and therefore
      dispositioned client x on-behalf-of-client as "In-scope (identity seam only)".
    why_that_position_was_wrong: >-
      The premise was false and the reference disproves it. client-email resolves the CLIENT
      actor to EXACTLY ONE context in each of its two matrices — ClientEmailsContextTypes and
      ClientEmailContextTypes are both SINGLE-MEMBER enums (client-email.types.ts:41-44,
      :66-69) — and its resolveClientId seam is live regardless. What keeps the seam honest is
      resolving the id FROM THE SCOPE CONTEXT rather than hardwiring the session id, not
      having two branches to choose between.
    what_changed: >-
      1. Every context type now names the ENTITY being addressed, never its owner and never an
         actor — client-email's own stated convention (ClientEmailContextTypes.EMAIL = "email",
         "the context names the ENTITY, not its owner: the owning client falls through the same
         resolveClientId seam"). A: VALUES (collection) + FIELD (image editor). B: PROFILE (both
         halves). Each a single-member enum. See design.md 2.2 and 3.2.
      2. `.for('client', id)` therefore exists NOWHERE in this pair, so the actor-retarget is
         not a named affordance and the NOT-SUPPORTED disposition is honest rather than
         advertised-but-absent (the FE-2824 shape).
      3. The two retarget acceptance criteria (formerly numbered twenty-six and fifty-eight) are
         deleted from requirements.md, tasks.md and this file. Their ids are retired, not reused, so
         a mechanical phantom-id sweep over the bundle returns zero.
      4. Arms determination UNCHANGED — all five layers `none` in both modules. A context is not
         an actor, so a second context could never have earned an arm; the resolving-ACTOR count
         per module was and remains exactly one.
    transparency_note: >-
      A VALUES / PROFILE context id equals the owning client's id, so a caller passing a
      different client's id would target that resource and receive a 403 from the API. That is
      the same property client-email's `.for('email', id)` already has — an entity id is an
      entity id and authorization is the API's job. What is removed is the NAMED actor-retarget
      affordance. Stated here rather than left for a reviewer to infer.
    planner_deviation_reported: >-
      The ruling's bullet "[ScopeActorTypes.CLIENT] resolves to exactly one context" is honoured
      for all four composables. It was NOT satisfied by reusing the owner as the context (the
      earlier draft's CLIENT = AccessRoleTypes.CLIENT), because that keeps `.for('client', id)`
      compiling against a NOT-SUPPORTED row. A brand context was also rejected:
      scope.types.ts:80 states brand is "Optional brand filter (not a context)", so naming it a
      context would contradict the platform's own type. Entity contexts are the only option that
      satisfies all three of the ruling's bullets at once.

