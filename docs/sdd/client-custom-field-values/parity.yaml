    variant: hybrid
    converts: first
    composables:
      - useClientCustomFields        # query-backed definitions collection
      - useClientCustomFieldImage    # machine-backed per-field IMAGE value editor (system-upload)
    depended_on_by:
      - packages/headless/src/modules/auth              # 4 files
      - packages/headless/src/modules/account
      - packages/headless/src/modules/basket-fields
      - packages/headless/src/utils/useFields.ts
      - packages/headless/src/modules/client-personal-details

    parity:
      - row: A-client-self
        actor: client
        context: self
        core: true
        disposition: In-scope
        oracle_evidence:
          - "views/client/account/profile/index.vue:17-25 — the customer area mounts clientCustomFieldsComp"
          - "clientCustomFieldsForm.vue:92-93 — values read keyed by the EMBEDDED field.code"
          - "clientCustomFieldsForm.vue:70-81,128-137 — dirty diff, ''->null, empty-diff no-op, code-keyed object"
          - "customFields.vue:219 — definitions refetch on the client's brand change"
          - "customFields.vue:348-400 — image upload with progress and the custom_fields.<code> error rewrite"
        acs: [AC-1, AC-2, AC-3, AC-4, AC-5, AC-6, AC-7, AC-8, AC-9, AC-10,
              AC-11, AC-12, AC-13, AC-14, AC-15, AC-16, AC-17, AC-18, AC-19,
              AC-20, AC-21, AC-22, AC-23, AC-24, AC-25, AC-27]
        notes: >-
          The resolving cell. Matrix key is ScopeActorTypes.CLIENT, never SELF — SELF is
          resolved by the builder (scope.builder.ts:274) before this module's factory runs.
        partial_delivery:
          - id: G-P2
            ac: AC-54
            shared_with_row: B-client-self
            capability: single shared profile read across modules A and B
            delivered: >-
              TWO DISTINCT CACHE KEYS over the same resource, so the two reads CANNOT be shared:
              where both paths run, the same profile is fetched twice rather than once. A's brand
              read goes through useQuery().get with queryKey ["client", id, "record"]
              (client-custom-fields.services.ts:185) and get() APPENDS a {locale} segment because the
              read does not pass withoutLocale (query/useQuery.ts:262); B's reactive loadProfile()
              uses a raw vueUseQuery key WITHOUT that segment. Pre-existing in kind, not introduced
              by this run. VERIFIED FROM SOURCE — this is the mechanism, not a count.
            count_status: CONTESTED — pending measurement at the service seam
            count_evidence:
              - "1 read — MEASURED by the verifier at the browser network layer, one
                 /account/profile load, both modules active (evidence/07-gaps-and-limits.md G3)"
              - "2 reads — OBSERVED in AC-54's integration spec harness"
              - "2 reads per boot — REPORTED, NOT MEASURED; the figure originated with the conductor,
                 who has since stated it was not measured. Also asserted in the module's own
                 @decision cost: field (client-custom-fields.services.ts:166-171), which should be
                 softened when the measurement lands."
            count_resolution_owed: >-
              Count at the SERVICE SEAM (call sites), not the network layer, where an in-flight dedupe
              or a warm staleTime: DAY entry can hide a second read. Routed to post-commit
              verification by the verifier. NOTE: the verifier's suggested reconciliation — a SHARED
              ["client", <id>, "record"] key collapsing the reads — is NOT supported by the keys as
              written (A's effective key carries {locale}, B's does not), so whatever caused the
              observed collapse was not key sharing. That mismatch is itself why the measurement is
              owed rather than settled by argument.
            do_not_quote_a_number: >-
              Until G3 is settled, state the mechanism (two keys => no sharing => a duplicate read
              where both paths run) and not a per-boot count.
            why_not_closable_here: >-
              Sharing the key would POISON the entry. useQuery applies `select` INSIDE queryFn
              (query/useQuery.ts:1012-1017), so the entry stores the SELECTED projection, not the raw
              response — whichever fetch won the race would feed A's brand_id string into B's
              select: mapProfile, or vice versa. Module A dropped its shared-cache claim deliberately
              on this basis. Two clean reads beat one corrupted entry.
            fix_location: >-
              query/useQuery.ts — apply `select` OUTSIDE queryFn (TanStack's own per-observer select),
              or cache one shared RAW entry with per-consumer selection. Only then can the two
              entries safely collapse.
            ac_impact: >-
              AC-54's request count is scoped to B's OWN read path, not to every GET on the wire. An
              assertion counting all GETs makes correct, deliberate behaviour look like a regression
              and pressures a reader into re-introducing the poisoned entry.
            disposition_note: >-
              NOT a dropped cell. Both cells are In-scope and delivered; one extra profile GET per
              boot is an accepted performance cost, recorded rather than hidden.
            existing_decisions: >-
              client-personal-details.services.ts:117-126 (hand-rolled key + "record" segment) and
              :181, :223 (the F5 record). The Linear issue should REFERENCE these, not restate them.
            drop_body: dropped-capabilities.md#6-parity-gaps-inside-an-in-scope-cell--partial-delivery
            linear_ref: PENDING-OPERATOR-FILING
          - id: G-P1
            ac: AC-18
            capability: byte-level upload progress for IMAGE custom fields
            delivered: >-
              Binary progress signal — 100 once the upload completes, else 0, alongside a real
              isUploading (useClientCustomFieldImage.meta.ts:50). No intermediate value is emitted.
            legacy_has: >-
              Real byte-level progress via axios onUploadProgress
              (customFields.vue:375-383, rendered :129-130, read back :417-433).
            why_not_closable_here: >-
              Three verified barriers, all outside this run's write scope (R5): (1) the transport is
              query's doFetch calling the NATIVE fetch (query/query.services.ts:50), which has no
              upload-progress hook; (2) system-upload's PROGRESS handler
              (system-upload.machine.ts:75) has ZERO dispatchers anywhere in packages/headless/src;
              (3) useUpload()'s return type does not expose the machine's progress context field.
            fix_location: >-
              query/query.services.ts doFetch (:19-50) — XHR or a ReadableStream request body; then
              system-upload.services.ts upload (:144-156) dispatches PROGRESS and useUpload.ts
              exposes it. Then meta.ts:50 becomes a pass-through and AC-18's read-back can require
              an advancing value again.
            rejected: >-
              A fake incrementing percentage on a timer — indistinguishable from real progress to a
              consumer, so worse than an honest binary. Developer @decision at
              useClientCustomFieldImage.meta.ts:5-33.
            disposition_note: >-
              NOT a dropped cell. The cell is In-scope and delivered; ONE capability within it is
              narrowed, openly, and AC-18 states the narrowing inline rather than promising the
              legacy behaviour.
            drop_body: dropped-capabilities.md#6-parity-gaps-inside-an-in-scope-cell--partial-delivery
            linear_ref: PENDING-OPERATOR-FILING
        negative_control_record:
          ac: AC-2
          control: client-custom-fields.session-hardwired-id.must-fail.patch
          status: RESOLVED — control AUTHORED, DRIVEN and CERTIFIED RED for the right reason
          # Trail kept deliberately: this is a worked example of an "accepted cost" that was
          # actually a COVERAGE HOLE. The distinction is the lesson, so it is not deleted.
          claim_as_recorded_2026_08_10: >-
            An earlier revision of this row recorded the control as STRUCTURALLY-UNAVAILABLE, on the
            reasoning that at client x self-only scope the scope-resolved client id and the session
            client id are the same value, so hardwiring the session client could not change the
            outbound request and no assertion could catch it.
          why_that_claim_was_FALSE: >-
            It confused ONE DECLARED ACTOR with ONE ADDRESSABLE IDENTITY. The matrix pairs the client
            actor with an ENTITY context that carries an id —
            [ScopeActorTypes.CLIENT]: ClientCustomFieldsContextTypes.VALUES (design.md 2.2) — so
            `.as(CLIENT).for(VALUES, someOtherId)` COMPILES and genuinely retargets, and
            resolveClientId's VALUES arm returns that other id. The plan's own transparency note in
            design.md 2.2 already said as much ("a caller passing a different client's id would
            target that client's resource"), so the claim contradicted this bundle's own design.
            The control was never unobservable — the path was simply UNEXERCISED, because every spec
            called `.as(SELF)`, for which scopeContext is undefined and resolveClientId always takes
            the session arm, which is byte-identical to what the mutant hardwires.
          what_the_driving_spec_proves: >-
            client-custom-fields.collection.int.test.ts:163-191 drives
            `.as(ScopeActorTypes.CLIENT).for(ClientCustomFieldsContextTypes.VALUES, targetId)` and
            files the A7 read-back on the OUTBOUND WIRE, never a response payload: the request URL
            carries the TARGET id; assertRetargetIdentityTransport (int-helpers.ts:372-382) asserts
            the Authorization header is the SESSION's own bearer and asserts NO acting-as headers
            (an entity retarget, not an actor swap); and a further assertion proves the session
            client's own id was never addressed. Applying the mutant — which deletes exactly the
            VALUES arm of resolveClientId — collapses the URL back to the session client and flips
            that spec RED with "No request addressed to the retargeted client ...".
          outcome: >-
            AC-2 is green on its success path AND backed by a proven-red negative control. No
            substitute was manufactured and AC-2 was never softened. All five of module A's mutants
            are certified red-for-the-right-reason.
          lesson: >-
            A single declared actor does not imply a single addressable identity. Where the matrix
            pairs an actor with an entity context carrying an id, the retarget path is LIVE and must
            be EXERCISED, or the identity seam goes unproven while every gate stays green — the
            FE-2824 shape wearing a different hat. Recorded at requirements.md AC-2 for the seats.
          see: dropped-capabilities.md#ac2-negative-control

      - row: A-client-onbehalf
        actor: client
        context: on-behalf-of-client
        core: false
        disposition: NOT-SUPPORTED
        signoff_token: "operator ruling R1 + conductor ruling 2026-08-10 (open_tensions[T1])"
        evidence_of_absence: >-
          The oracle exhibits NO client-acting-for-another-client custom-fields capability, so
