# -----------------------------------------------------------------------------
# THE ORACLE — external to the author. Never the new code's own tests.
# -----------------------------------------------------------------------------
oracle:
  kind: legacy-application-plus-recorded-acceptance
  sources:
    - name: legacy vue-app client portal
      ref: scratchpad/repos/vue-app @ 47fdeb0c
      surfaces:
        - src/store/modules/data/clients/addresses.ts
        - src/components/app/global/client/addEditClientAddressModal.vue
        - src/components/app/global/client/billableEntitiesProvider.vue
        - src/components/app/global/address/addEditAddressForm.vue
        - src/components/app/global/fields/clientAddressSelect.vue
        - src/components/app-base/UAddress.vue
        - src/store/modules/user/index.ts
    - name: current headless module (the thing being converted)
      ref: packages/headless/src/modules/client-address/ @ bff994868
    - name: recorded acceptance
      ref: tests/Playwright/e2e/support/flows/address-setup.ts (+ order-billing-setup.ts)
      note: >-
        Its CURRENT outbound requests are recorded by task T-1 BEFORE any task
        edits it. That recording is the diff target for AC-38.
  axis_of_variation: ADR-001 actor x context (cite; do not restate)

disposition_enum:
  - Direct
  - Renamed
  - Absorbed-by
  - Dropped-with-Linear-issue
  - Not-supported-with-reason

# `delivery` is an ADDITIONAL axis, not a disposition. It says how a Direct row
# arrives; it never substitutes for a disposition, and effort is never either.
delivery_enum:
  - existing # already delivered by the module today, carried unchanged
  - fixed # delivered today but wrong; this story corrects it
  - built # oracle has it, module does not; this story builds it
  - relocated # same capability, different owner (see Absorbed-by)
  - not-applicable

# =============================================================================
# CELLS — the ADR-001 actor x context matrix. One row per cell, per composable.
# undispositioned_parity_cell_count MUST be 0.
# =============================================================================
cells:
  - id: CELL-1
    composable: useClientAddresses
    actor: CLIENT
    context: ClientAddressesContextTypes.CLIENT
    disposition: Direct
    delivery: existing
    reason: >-
      The one live collection cell. Operator ruling R1 binds the token to
      ScopeActorTypes.CLIENT (client-company precedent), not SELF.
    evidence: [AC-1, AC-2, AC-3]

  - id: CELL-2
    composable: useClientAddresses
    actor: SELF
    context: ClientAddressesContextTypes.CLIENT
    disposition: Not-supported-with-reason
    delivery: not-applicable
    reason: >-
      SELF resolves to a concrete actor at runtime BEFORE the scope factory runs,
      so its matrix row is `null as never` in all three merged references
      (client-company.types.ts:58,82). Ruling R1 makes CLIENT the call-site
      token. Encoding SELF would advertise a route that cannot carry `.for()`
      (hazard Z3) — the advertised-but-absent defect this story closes.
    evidence: [AC-33, AC-36]

  - id: CELL-3
    composable: useClientAddresses
    actor: STAFF
    context: ClientAddressesContextTypes.CLIENT
    disposition: Dropped-with-Linear-issue
    delivery: not-applicable
    linear_ref: OWED — unfiled
    reason: >-
      The oracle plainly supports it (admin endpoint family +
      list_client_addresses gate). Operator ruling R2 keeps scope at
      client x self. Encoded as `[ScopeActorTypes.STAFF]: null as never`.
      CORRECTED 2026-08-14 — revision 2 said this made `.as('staff')` a
      COMPILE-TIME error. It does not, and the claim is WITHDRAWN (disproved by
      a real ts.createProgram probe against ScopeBuilderResult,
      scope.builder.ts:~184). The corrected claim, verbatim across all three
      lanes: `.as()` accepts every `ScopeActorTypes` at compile time; a
      `null as never` matrix row removes `.for(...)` for that actor and nothing
      else. What the type system enforces: `.as('staff'|'guest'|'self')
      .for(ADDRESS, id)` do not compile, `.as('client').for(ADDRESS, id)` does,
      and `useClientAddressManager(undefined, { clientId })` is `TS2554`.
      Delivering a compile error on `.as('staff')` itself would require
      `scope.builder.ts` (protected core) — forbidden by D-2 / NFR-4, so the
      CLAIM is corrected and the CODE is not. What keeps this cell from being a
      silent gap is NOT a type error: it is the removal of `.for()` plus rows
      D1, D2, D3, D7 below.
    evidence: [AC-33]

  - id: CELL-4
    composable: useClientAddresses
    actor: GUEST
    context: ClientAddressesContextTypes.CLIENT
    disposition: Not-supported-with-reason
    delivery: not-applicable
    reason: >-
      Neither oracle has a guest address route. Every legacy path is
      clients/{id}/addresses under a client or admin session; headless rejects
      NotAuthenticatedError on every write. Row N1.
    evidence: [AC-34]

  - id: CELL-5
    composable: useClientAddressManager
    actor: CLIENT
    context: ClientAddressContextTypes.ADDRESS
    disposition: Direct
    delivery: existing
    reason: >-
      The one live editor cell. variant=hybrid was DERIVED from the oracle (the
      module interprets dataManagerMachine today) — amputating it is the
      2026-08-05 client-email failure verbatim.
    evidence: [AC-16, AC-17, AC-24, AC-30]

  - id: CELL-6
    composable: useClientAddressManager
    actor: SELF
    context: ClientAddressContextTypes.ADDRESS
    disposition: Not-supported-with-reason
    delivery: not-applicable
    reason: >-
      As CELL-2, and materially worse here: the manager is per-entity and needs
      `.for()`, which `.as(SELF)` does not statically expose. Measured proof of
      the cost of the alternative: TabPersonal.vue:100-117 hand-rolls a
      ScopeBuilderActorWithContexts cast for phones (SELF) that
      TabBusiness.vue:204-207 does not need for companies (CLIENT).
    evidence: [AC-33, AC-36]

  - id: CELL-7
    composable: useClientAddressManager
    actor: STAFF
    context: ClientAddressContextTypes.ADDRESS
    disposition: Dropped-with-Linear-issue
    delivery: not-applicable
    linear_ref: OWED — unfiled
    reason: >-
      The oracle supports staff creating / updating / deleting a client's
      addresses through the admin endpoint family, gated by three permissions.
      Ruling R2. Rows D1, D2, D4, D5, D6, D8.
    evidence: [AC-33]

  - id: CELL-8
    composable: useClientAddressManager
    actor: GUEST
    context: ClientAddressContextTypes.ADDRESS
    disposition: Not-supported-with-reason
    delivery: not-applicable
    reason: As CELL-4. Row N1.
    evidence: [AC-34]

# =============================================================================
# ARMS — derived MECHANICALLY per clause 3 of the variance law
# (.claude/skills/scoped-composable-factory/templates/ARMS.md).
#
# The test: a layer earns an actor arm ONLY when at least one actor has a member
# EXCLUSIVE to it, or OVERRIDING the shared factory. With exactly ONE live actor,
# nothing can vary BY ACTOR, so the derivation yields nothing at every layer.
# This is NOT "armless because the module is new" and NOT "armless because no
# exemplar exists" — ARMS.md forbids both reasons explicitly.
# =============================================================================
arms:
  services:
    value: none
    earning_actors: []
    derived_from_rows: [W1, W2, W3, W4, W5, W6, W7, W8, W9, W10, W11, W12]
    reason: >-
      Every wire row resolves ONE client through ONE seam against ONE endpoint
      family (clients/{id}/addresses). The second family
      (api/admin/clients/{id}/addresses) belongs to row D1, which is DROPPED, so
      no live actor diverges. Restoring D1 would arm this layer FIRST.

  actions:
    value: none
    earning_actors: []
    derived_from_rows:
      [A8, A9, A10, A11, A12, A13, A14, A15, A16, M11, M12, M13, M18, M19]
    reason: >-
      One live actor; no actions member is exclusive to, or overrides, another
      actor's. The four legacy permission gates that could gate remove /
      setDefault are staff-only (rows D4, D5, D6) and therefore out of cell.

  context:
    value: none
    earning_actors: []
    derived_from_rows:
      [A1, A3, A4, A5, A6, A7, M1, M2, M3, M4, M5, M6, M7, M8, M9, M10]
    reason: >-
      The row shape and the computed values are identical for every live actor —
      there is only one. Recorded for a future run: even if D1 were restored,
      context would still NOT arm; the Address row shape is identical for staff
      and client.

  meta:
    value: none
    earning_actors: []
    derived_from_rows: [A2, M14, M15, M16, M17]
    reason: >-
      Checked against ARMS.md's 2026-07-31 incident (meta wrongly derived `none`
      because a capability flag "only gated actions"). This module has NO
      per-actor capability flag in cell at all: legacy's can() returns true
      unconditionally outside admin context (store/modules/user/index.ts:23-47),
      so in client x self every address permission is always true. There is no
      gating boolean to surface as read-state. `none` survives the check.

  schemas:
    value: none
    earning_actors: []
    derived_from_rows: [X1, X2, X3, X4, X5, X6, X7, X8, L4, L5]
    reason: >-
      One form, one field set, one set of rules for the one live actor. The
      lockCountry rule (L4) varies by BRAND CONFIG and by new-vs-existing, not by
      ACTOR — a config-driven rule is not an actor arm. The pair law
      (schema + uischema move together) is honoured within the shared file.

  developer_seat_obligation: >-
    The developer seat re-derives all five independently from this table.
    A MISMATCH HALTS THE RUN — it is not reconciled toward this file.

