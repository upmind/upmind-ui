# =============================================================================
# client-address — Capability Parity Table
#
# Governed by rules/verify-parity-oracle.md + .claude/rules/verify-parity-oracle.companion.md.
# One row per axis of behavioural variation the oracle exposes. Every row carries
# exactly one disposition. A blank, a bare "n/a", or an unexplained "not needed"
# is a silent drop wearing paperwork and is treated as a MISSING row.
#
# Companion to requirements.md (rulings R1-R8, AC-1..AC-40) and design.md (D-1..D-14).
# =============================================================================

