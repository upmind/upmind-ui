# client-phone — ADR-001 capability parity table (planned, 2026-08-08)
#
# ############################################################################
# # OPEN: 12 DROPPED CAPABILITIES ARE TRACKED NOWHERE YET (blocker B1)       #
# ############################################################################
# The disposition `Dropped-with-Linear-issue` carries a contract in its name
# (verify-parity-oracle.companion.md): a dropped capability is recorded WITH its
# Linear issue reference. Twelve rows — R1, S1-S7, L1, L2, L3, L9 — carry
# `linear: UNFILED` because the Linear MCP session was UNAUTHENTICATED when this
# repair ran (2026-08-10). No issue ids were invented and none were created.
#
# THE PASTE-READY FILING LIST IS THE SIBLING FILE `DROPS-TO-FILE.md` — row id,
# capability, oracle citation and a suggested issue title for each of the 12.
#
# B1 CANNOT BE CLOSED FROM THE PLANNING SEAT. It requires an authenticated
# Linear session: the operator (or an authenticated run) files the 12 issues,
# then replaces each row's `linear: UNFILED ...` with the issue identifier.
# Until then this table's twelve drops are signed but untracked.
# ############################################################################
#
# Oracle (verify-parity-oracle.companion.md — legacy application + recorded
# acceptance), three sources, all consulted at the Research stage:
#   1. the current headless module on this branch
#      (packages/headless/src/modules/client-phone/ — 9 files, 1,195 LOC)
#   2. the LEGACY vue-app client phone surface at /Users/dom/Documents/Upmind/vue-app
#      — src/store/modules/data/clients/phones.ts,
#        src/components/app/global/client/{clientPhonesComp,clientPhonesList,
#        clientPhoneRow,addEditClientPhoneModal}.vue,
#        src/components/app/global/fields/{clientPhoneSelect,phoneNumberField}.vue,
#        src/components/app/global/baskets/basket/basketClientPhoneSelector.vue,
#        src/views/{client/account,admin/clients/client}/profile/index.vue,
#        src/data/status.ts:384 (PhoneTypes)
#   3. recorded acceptance — NONE EXISTS for phone management. No e2e spec
#      asserts it; the module ships zero colocated tests; the single in-repo
#      test that touches it (basket-billing/unified/__tests__/unified.int.test.ts:50)
#      MOCKS the whole module. This is why row X4 (fixture capture) is a
#      first-class row rather than a task detail.
# The new module's own tests are NOT the oracle and were not used as one.
#
# ADR-001 axis of variation: actor x context. This module has exactly ONE
# resolving cell — client x self — by OPERATOR RULING 1 (2026-08-08). Both
# scope matrices set SELF / STAFF / GUEST to `null as never`, so `.as('staff')`
# is a compile-time error rather than an advertised-but-absent capability.
#
# THE ORACLE DOES EXPOSE STAFF CAPABILITY. Unlike client-email-history (whose
# oracle had no client-targeted endpoint at all), legacy vue-app ships a
# distinct admin endpoint family `api/admin/clients/{clientId}/phones`, four
# staff capability gates, an acting-as-client impersonation branch and an admin
# view mounted against an arbitrary client id. Every one of those is recorded
# below as a `Dropped-with-Linear-issue` row (S1-S7) under the operator
# sign-off of 2026-08-08 — the client-email R27-R33 shape. NONE is converted to
# a "never existed" row: converting an oracle-demonstrated capability into
# not-applicable is paperwork standing in for permission, which
# verify-parity-oracle.md forbids.
#
# Dispositions used (declared vocabulary):
#   Direct                              byte-for-byte unchanged
#   Renamed                             behaviour carried; access path changed
#                                       with the four-layer shape
#   Absorbed-by                         capability survives inside another member
#   Added-by-pattern                    new capability the reference conversion
#                                       brings; not a parity obligation
#   Fixed-with-decision                 oracle behaviour deliberately corrected;
#                                       carries a design.md @decision block
#   Dropped-with-Linear-issue           capability the oracle has and this
#                                       delivery does not; operator-signed
#   NOT-SUPPORTED-IN-LEGACY-with-reason no oracle capability to carry
#   NOT-A-HEADLESS-CAPABILITY-with-reason  a consumer/presentation concern, not
#                                       a headless capability
#
# UNDISPOSITIONED ROWS: 0. Every row below carries a `disposition:`.
#
# Convention: `Renamed` marks a capability whose behaviour is carried over but
# whose consumer-facing access path changed with the four-layer shape
# (`meta.value.isLoading` -> `useMeta().isLoading`, and so on). `Direct` is
# reserved for what is byte-for-byte unchanged.
#
# STATUS: PLANNED, not as-built. `proof:` keys name the read-back each row OWES;
# the prover fills the concrete spec/line at Test, and Verify grades the
# delivered module against this table.

