# --- Arms determination (variance law clauses 2 and 3) ----------------------
# Five layers x two composables. ALL ARMLESS — derived, not asserted.
#
# DERIVATION. An arm earns its place only when an actor gets a member EXCLUSIVE
# to it, or one OVERRIDING the shared factory with a genuine A-vs-A+B
# divergence. Both tests are relational: they compare one actor's members
# against another's. Under ruling 1 exactly ONE actor resolves in either matrix
# (CLIENT); SELF is resolved by the scope builder before any factory runs
# (clause 4), and STAFF / GUEST are `null as never`. With a single resolving
# actor there is no second actor to be exclusive against and no shared-versus-
# actor pair to override, so no member of any layer can satisfy either test.
# Independently, scope-based/arm-in-matrix makes an arm for an undeclared actor
# an orphan, and scope-based/no-cosplay-arm makes an arm with nothing exclusive
# an empty scaffold.
#
# ROW-LEVEL CHECK: the rows that could have earned an arm are S1-S7 (the staff
# endpoint family, the four capability gates, the acting-as-client branch, the
# staff copy). Every one is a Dropped-with-Linear-issue row. A dropped
# capability has no code path, and a layer cannot vary over behaviour that is
# not implemented. Therefore: no layer is armed, and no row earns one.
arms:
  services:
    armed: false
    earned-by: []
    reason: >-
      One resolving actor (client) in both matrices; no per-actor member to
      select. `scopedServices(scopeActor, scopeContext)` carries a `default:`
      case only. `scopeActor` is accepted and unused, kept in the signature so a
      future arm switches on it without a call-site change.
  actions:
    armed: false
    earned-by: []
    reason: >-
      Every action is shared across the single cell, in both the collection and
      the manager factory. The merge seam (a spread that lands LAST, never a
      `.base.ts` file) is marked in-file in both.
  context:
    armed: false
    earned-by: []
    reason: One data shape per surface, actor-independent.
  meta:
    armed: false
    earned-by: []
    reason: >-
      No per-actor capability read-state exists. Legacy's `$userCan(...)` gates
      (S2-S5) and its actor-derived guidance copy (S7) are the only candidates;
      all of them are staff-side and every staff row S1-S7 is dropped, so there
      is no "can this actor do X" flag to vary. `meta` is nonetheless the layer
      most likely to earn the FIRST arm if any staff cell is ever restored.
  schemas:
    armed: false
    earned-by: []
    reason: >-
      One schema, built from the resolved country and nothing actor-derived.
      No `client-phone.schemas.{actor}.ts` file exists.

# ---------------------------------------------------------------------------
# CAPABILITY CELLS
# ---------------------------------------------------------------------------
cells:

  # === THE COLLECTION — useClientPhones ====================================

  - id: C1
    actor: client
    context: self
    capability: Read my own phone collection
    oracle: useClientPhones().data — service.loadList, GET clients/{session.client.id}/phones
    now: useClientPhones().as(CLIENT).useContext().data
    disposition: Renamed
    ac: AC-1
    note: >-
      Same URL, same base query key ["client","phones"], same select: mapPhones,
      same staleTime: DAY, same retryDelay: DEBOUNCE_DELAY. Access path moved
      behind the four-layer return; the resolved client id now travels as a ref
      INSIDE the query key so a late-resolving id re-derives into a different
      cache entry rather than poisoning the unaddressable one.
    proof: >-
      collection.int.test.ts AC-1 — assert the intercepted request URL carries
      the session client id AND the client bearer token, then the mapped row ids
      against the recorded fixture. Negative control: scope-derived-id.must-fail.patch.

  - id: C2
    actor: client
    context: self
    capability: See each phone's parsed number, display fields and status flags
    oracle: mapPhone — id, title (international_phone), description (phone_country_code), parsed phone{number,nationalNumber,countryCallingCode,country}, type, meta{isDefault,canDelete,isVerified}
    now: identical mapper, moved to client-phone.mappers.ts (@internal)
    disposition: Renamed
    ac: AC-2
    note: >-
      File renamed mapper.ts -> client-phone.mappers.ts for reference parity;
      the mapping itself is byte-identical. `meta.canDelete` is the capability
      behind legacy's non-deletable tooltip (see L5).
    proof: >-
      mappers.test.ts (unit) — one assertion per field against a recorded row;
      collection.int.test.ts AC-2 asserts the three-row default/non-deletable/
      unverified fixture's meta triples independently, not as a snapshot.

  - id: C3
    actor: client
    context: self
    capability: Know whether the list is loading, empty or errored
    oracle: meta computed — isLoading, isEmpty, hasError
    now: useMeta().isLoading / .isEmpty / .hasError — one flat computed per flag
    disposition: Renamed
    ac: AC-3
    note: >-
      The single `meta` object is gone; consumers read useMeta().isLoading where
      they read meta.value.isLoading. `hasError` becomes truthiness rather than
      isEmpty(), because a TanStack error is an Error instance with no own
      enumerable keys, which isEmpty reports as empty.
    proof: collection.int.test.ts AC-3 — each flag asserted at the transition that owns it.

  - id: C4
    actor: client
    context: self
    capability: Know whether the collection is addressable at all
    oracle: meta.isAvailable — isAuthenticated.value
    now: useMeta().isAvailable — handed straight through from service.isAvailable
    disposition: Fixed-with-decision
    ac: AC-3, AC-15
    decision: design.md D-2
    note: >-
      The oracle's flag reads isAuthenticated ALONE while its list query's
      `enabled` reads isAuthenticated && !!client.id — the rendered flag and the
      enforced gate disagree. The conversion makes them the SAME function:
      isAddressable(clientId) is the module's one predicate, exposed reactively
      as service.isAvailable, and meta reads it rather than re-deriving it.
    proof: >-
      guard.int.test.ts AC-15 — an authenticated session with no resolved client
      reads isAvailable false and fires zero requests. Negative control:
      client-id-limb.must-fail.patch.

  - id: C5
    actor: client
    context: self
    capability: Wait for the collection to be ready
    oracle: isReady() — polls query.isFetched on a 100ms setInterval, else ensureAuth().then(refetch)
    now: useActions().isReady() — awaits the settled addressability outcome, then the first fetch
    disposition: Fixed-with-decision
    ac: AC-4
    decision: design.md D-2 (same predicate-unification decision)
    note: >-
      The oracle's setInterval poll never clears on the unauthenticated path and
      its ensureAuth() branch resolves only on INITIALISED, so a failed session
      boot leaves it pending forever. The reference's addressableOutcome() /
      whenSessionSettles() pair resolves false on both terminal outcomes. Same
      capability, no hang.
    proof: >-
      collection.int.test.ts AC-4 — a guest-floor session resolves isReady() to
      false within the spec timeout with zero requests recorded.

  - id: C6
    actor: client
    context: self
    capability: Read the default phone
    oracle: default — useCollection().getDefault, matches meta.isDefault
    now: useContext().default
    disposition: Renamed
    ac: AC-5
    proof: collection.int.test.ts AC-5 — default()?.id against a fixture whose SECOND row is the default; undefined against an all-non-default fixture.

  - id: C7
    actor: client
    context: self
    capability: Look a phone up by id
    oracle: getOne(id) — useCollection
    now: useContext().getOne
    disposition: Renamed
    ac: AC-6
    proof: collection.int.test.ts AC-6 — hit and miss, with zero outbound requests.

  - id: C8
    actor: client
    context: self
    capability: Find a phone by partial mapping
    oracle: findOne(mapping) — useCollection; the seam `ensure` matches on
    now: useContext().findOne
    disposition: Renamed
    ac: AC-6
    proof: collection.int.test.ts AC-6 — findOne({phone:{number}}) resolves the row by parsed number.

  - id: C9
    actor: client
    context: self
    capability: Delete a phone
    oracle: remove(id) — DELETE clients/{id}/phones/{phoneId}, feedback error.client_phone_delete_failed / confirm.phone_removed, invalidate non-exact
    now: useActions().remove(id)
    disposition: Renamed
    ac: AC-7, AC-9
    note: >-
      Feedback behaviour is preserved EXACTLY as the oracle has it — this is the
      one place client-phone's oracle raises feedback from a row mutation and
      dropping it would be a silent capability loss. Note the divergence from
      the client-email reference, which raises none; client-phone's oracle does,
      so client-phone keeps it. The mutation error is ALSO captured into
      useContext().error as state (C10).
    proof: >-
      mutations.int.test.ts AC-7 — one DELETE to the session-client URL on the
      client token; success feedback carries confirm.phone_removed; cache key
      invalidated non-exact. Negative control: feedback.must-fail.patch.

  - id: C10
    actor: client
    context: self
    capability: Surface a failed row mutation as readable state
    oracle: none — the oracle raises feedback and discards the error
    now: useContext().error — the scope's captured failure, read never raised; useMeta().hasError
    disposition: Added-by-pattern
    ac: AC-9
    note: >-
      ERRORS ARE STATE, NOT EVENTS (the reference's rule). This ADDS a read
      surface; it does not remove the oracle's feedback (C9, C11), which still
      fires. No parity obligation — recorded so Verify does not read it as scope creep.
    proof: mutations.int.test.ts AC-9 — on a recorded 422, error.value is populated AND the error feedback fires. Both, not one.

  - id: C11
    actor: client
    context: self
    capability: Promote a phone to default
    oracle: setDefault(id) — PUT clients/{id}/phones/{phoneId} body {default:true}, feedback error.client_phone_set_default_failed / confirm.phone_set_default, invalidate
    now: useActions().setDefault(id)
    disposition: Renamed
    ac: AC-8
    note: The request body is the capability. A PUT with any other body is a different operation.
    proof: >-
      mutations.int.test.ts AC-8 — the PUT body is asserted to be exactly
      {default:true}. Negative control: default-body.must-fail.patch.

  - id: C12
    actor: client
    context: self
    capability: Re-read the list from the server
    oracle: refresh — query.refetch, bare
    now: useActions().refresh() — rejects with NotAuthenticatedError when unaddressable
    disposition: Fixed-with-decision
    ac: AC-10
    decision: design.md D-2
    note: >-
      TanStack's refetch() resolves with the error on the result rather than
      rejecting, so the oracle's bare refetch silently reports success over an
      empty list on an unaddressable scope. Wrapped per the reference so a forced
      read can reject at all.
    proof: collection.int.test.ts AC-10 — rejects and fires zero requests when unaddressable; exactly one GET when addressable.

  - id: C13
    actor: client
    context: self
    capability: Mark the cached collection stale
    oracle: invalidate — invalidateQueryByKey(service.queryKey, {exact:false})
    now: useActions().invalidate — same key, same exactness
    disposition: Renamed
    ac: AC-10
    proof: module.int.test.ts AC-10 — a manager save and a bare invalidate() both trigger exactly one collection refetch.

  - id: C14
    actor: client
    context: self
    capability: Page through the collection
    oracle: nextPage / prevPage (query.fetchNextPage / fetchPreviousPage) + pagination descriptor
    now: >-
      NOT on the public actions surface. `useClientPhones.ts:41` opens the list
      with `service.loadList({ pagination: { limit: 0 } })` — an UNPAGINATED read
      (`limit=0&offset=0`) that returns the client's ENTIRE phone collection in
      one request, so a consumer of `useContext().data` never needs a second page.
      Page-walking survives one layer down, at the services layer:
      `createClientPhoneServices(CLIENT).loadList({ pagination: { limit: n } })`
      returns a genuinely paged query with working `fetchNextPage` /
      `fetchPreviousPage` and a live `pagination` descriptor.
      `useContext().pagination` is carried through and populated.
    disposition: Absorbed-by
    absorbed-by: C1
    ac: AC-11
    defect: >-
      `useActions()` STILL ADVERTISES `nextPage` and `prevPage`
      (useClientPhones.actions.ts:154,157 — bound to the `limit: 0` query's
      `fetchNextPage` / `fetchPreviousPage`). Because that query is unpaginated,
      both members ALWAYS THROW `text.page_next_not_available`; they can never
      succeed through the public surface. Advertised-but-absent, recorded here
      rather than left implicit. NO user-facing capability is lost — the consumer
      already holds every row — but two public members are unreachable.
    proof: >-
      collection.int.test.ts AC-11 (:340-367) — two recorded page fixtures; the
      first GET carries limit=2&offset=0, `fetchNextPage()` produces
      limit=2&offset=2, and pagination.value.total matches the recorded envelope
      total. NOTE: this proof exercises the SERVICES layer
      (`createClientPhoneServices(ScopeActorTypes.CLIENT).loadList(...)` and the
      raw query's `fetchNextPage`); it never touches `useClientPhones()`,
      `.as(...)` or `useActions()`. That is honest for THIS row as now worded —
      the services layer is where paging lives — but the row's proof does NOT and
      cannot cover the two public members, which have no passing read-back.
    note: >-
      RE-DISPOSITIONED at plan repair (2026-08-10, reviewer finding W4). Formerly
      `Renamed` claiming `useActions().nextPage / .prevPage`; execution showed
      that claim false. `Absorbed-by: C1` because the capability the oracle
      delivers — the consumer can see all of their phone numbers — is delivered
      whole by C1's single unpaginated read, not because paging was reproduced.
      NOT a client-phone regression: the merged, accepted client-email reference
      does the identical thing (`loadList({pagination:{limit:0}})` with
      `nextPage: query.fetchNextPage`), so this is a property of the RATIFIED
      conversion pattern. That is why the reviewer graded it amber, not red.
    follow-up: >-
      AGAINST THE REFERENCE PATTERN, NOT THIS MODULE. R1 and C14 are the same
      defect class — a member the public surface advertises and cannot deliver
      (R1's own note names it "the FE-2824 archetype in miniature") — and they
      are resolved OPPOSITE ways: operator ruling 2 REMOVED R1's `clientId` limb,
      while C14 keeps two always-throwing members because the ratified reference
      keeps them. Recorded, not resolved: ruling 2 is not re-litigated here and no
      code changed. The consistent resolutions are either (a) drop `nextPage` /
      `prevPage` from the public actions layer of every module built on this
      pattern, or (b) let the collection accept a pagination argument so they can
      work. Both are pattern-level decisions the operator owns.

  - id: C15
    actor: client
    context: self
    capability: Filter the collection by free text
    oracle: filters.query(value) — set(filters,'query',value) then query.filter(filters)
    now: useActions().filters.query(value)
    disposition: Renamed
    ac: AC-12
    note: >-
      The oracle initialises filters to { query: "" } and defaults an absent
      value to ""; the reference initialises to {} and passes value through.
      Behaviour is equivalent for every live consumer (none reads the initial
      filter object); the reference shape is taken.
    proof: collection.int.test.ts AC-12 — the second GET carries the filter in its query string; the pre-filter request is not re-fired.

  - id: C16
    actor: client
    context: self
    capability: Destroy the scoped collection instance
    oracle: none — the pre-scope composable has no registry to leave
    now: useActions().destroy() — removes the registry entry
    disposition: Added-by-pattern
    ac: AC-14
    note: >-
      Required by the scoped architecture, not by parity. Without it a scoped
      collection holds a live TanStack observer at staleTime: DAY past its
      consumer's unmount — the leak client-email-history's W-B repair round
      recorded. Recorded here so a consumer knows to call it.
    proof: collection.int.test.ts AC-14 — registry size decreases by one; the post-destroy handle is not reference-equal to the pre-destroy one.

  # === THE MANAGER — useClientPhoneManager =================================

  - id: M1
    actor: client
    context: self
    capability: The per-phone form editor exists at all
    oracle: useClientPhoneManager — dataManagerMachine-backed, exported from the barrel
    now: useClientPhoneManager().as(CLIENT).for(PHONE, id) / .fresh()
    disposition: Renamed
    ac: AC-16, AC-17
    note: >-
      THE AMPUTATION ROW. On 2026-08-05 a client-email run took variant=query
      against an oracle that shipped a manager and deleted the whole half with
      every gate green. client-phone ships BOTH halves and both are consumed as
      a pair by five live call sites. This row is why variant=hybrid.
    proof: >-
      surface.test.ts AC-16 — the barrel's runtime value exports are enumerated
      against an explicit allow-list that names useClientPhoneManager. Negative
      control: manager-amputation.must-fail.patch MUST land red.

  - id: M2
    actor: client
    context: self
    capability: Resolve the country and seed the form's base model before it is usable
    oracle: loadLookups — useSystem().isReady/ensureCountries/getCountry, rejects error.system_not_available / error.countries_load_failed, seeds baseModel.phone.country
    now: the machine's loadLookups service, threaded the scoped services instance
    disposition: Renamed
    ac: AC-18
    note: >-
      Also absorbs legacy's brand-country default (L8): the capability is "the
      form opens on a sensible dial country"; the SOURCE moves from brand.country_id
      to useSystem().getCountry.
    proof: manager.int.test.ts AC-18 — on a recorded countries fixture, a fresh draft's model.phone.country equals the resolved code and isDirty reads false before a keystroke.

  - id: M3
    actor: client
    context: self
    capability: Read the form's JSON schema and UI schema
    oracle: schema / uischema from machine context; ALSO exported bare from the barrel as usePhoneSchema / usePhoneUischema
    now: useContext().schema / .uischema — machine context only; the bare pair leaves the barrel
    disposition: Renamed
    ac: AC-19
    decision: design.md D-4
    note: >-
      The schema itself is unchanged, including required ["number","nationalNumber",
      "countryCallingCode","country"] and the custom AJV keyword phone_country_code.
      What changes is the ACCESS PATH: a form rendered from a schema the machine
      has not adopted validates against a different contract than the one that
      saves. The one consumer of the bare pair is handled in X2.
    proof: >-
      schemas.test.ts (unit) — required array and the phone_country_code keyword;
      surface.test.ts AC-19 — the bare pair is absent from the barrel.

  - id: M4
    actor: client
    context: self
    capability: Parse typed input into the four-part phone model
    oracle: parse — libphonenumber-js, fallback chain (parsed -> prior model value -> event country -> context country), re-resolves country via useSystem().getCountry on change
    now: the machine's parse service — same chain, same re-resolution
    disposition: Direct
    ac: AC-20
    note: >-
      The fallback chain is the capability and it is subtle. Each `||` arm exists
      because a partially-parseable number must not lose the component the
      previous parse established.
    proof: >-
      manager.int.test.ts AC-20 — a bare national number under a GB context
      yields +44... and countryCallingCode 44; a number whose country differs
      re-resolves country. Negative control: parse-fallback.must-fail.patch.

  - id: M5
    actor: client
    context: self
    capability: Validate the model and report field-level errors
    oracle: validate — useValidation().validate(schema,model), rejects DetailedError(error.client_phone_validation_failed, 422) carrying ErrorObject[]
    now: the machine's validate service; errors read at useContext().validationErrors
    disposition: Renamed
    ac: AC-21
    proof: manager.int.test.ts AC-21 — an unparseable number yields a non-empty validationErrors array whose first entry's instancePath names the phone subtree, and zero outbound requests.

  - id: M6
    actor: client
    context: self
    capability: Input a model (debounced)
    oracle: input — debounce(input, DEBOUNCE_DELAY), waits for available.valid/invalid, rejects error.input_not_available
    now: useActions().input — one debouncer per SCOPE, not per useActions() call
    disposition: Renamed
    ac: AC-20
    note: >-
      The per-scope actions instance is load-bearing: a debouncer minted per call
      gives two keystrokes two independent timers and leaves update()'s pre-save
      flush with nothing to flush.
    proof: manager.int.test.ts AC-20 — two useActions() handles from the same scope share one debouncer (the second call cancels the first's pending parse).

  - id: M7
    actor: client
