# docs/corpus/glossary.yaml
#
# Hand-authored glossary source (FE-3003 corpus slice, design §5.5). This is the
# ONLY hand-authored file under docs/corpus/ and is explicitly excluded from the
# machine-owned manifest (design §8.1) — it encodes human intent, so a referent
# that no longer resolves FAILS CI rather than being pruned (design §5.3, 3003-AC2).
#
# One entry per term. Compiled by build.mjs into corpus.glossary.terms (keyed by
# slug); every referent `id` must resolve in corpus.index.
#
# Format (design §5.5):
#   <slug>:
#     term: <canonical name>
#     kind: domain | system
#     aliases: [ ... ]
#     definition: <one short paragraph>
#     referents:
#       - { type: symbol | guide | adr | example, id: <CorpusId> }
#
# Referent id conventions (corpus.types.ts):
#   symbol -> "@upmind-automation/headless!<export>"   (TypeDoc pkg!export)
#   adr    -> "adr:<basename-without-extension>"
#
# Populated (FE-3003p-AC1) to core-vocabulary coverage. Every referent below was
# verified against packages/headless/src (TypeDoc-documented exports) and
# docs/adr/ — no invented ids (gate:symbols would RED otherwise).
#
# NOTE (ontology fix, FE-3003p-AC1): "cart" is NOT an alias of "basket". Basket
# is the domain concept (the in-progress order); cart (apps/cart) is the Vue
# storefront app that renders it. They are related, not synonymous — see the
# "cart" term below.

basket:
  term: basket
  kind: domain
  definition: >-
    The customer's in-progress order — the collection of products, billing
    cycles, promotions, and currency selected before checkout. The headless
    basket is the reactive source of truth the storefront app reads and
    mutates.
  referents:
    - { type: symbol, id: "@upmind-automation/headless!useBasket" }
    - { type: symbol, id: "@upmind-automation/headless!BasketContext" }

cart:
  term: cart
  kind: system
  definition: >-
    The Vue.js storefront app (`apps/cart`) that renders the customer-facing
    basket and checkout UI. It is a consumer of the headless business logic
    and the client-vue integration layer, not the basket concept itself — see
    the package-layer split in ADR-007.
  referents:
    - { type: adr, id: "adr:007-headless-architecture" }

session:
  term: session
  kind: system
  aliases: [auth session]
  definition: >-
    The authenticated (or guest) context a basket and its actions run within,
    including the current client, brand, and access tokens. Session state is
    coordinated by the session composable and its state machine.
  referents:
    - { type: symbol, id: "@upmind-automation/headless!useSessionStore" }
    - { type: adr, id: "adr:002-session-and-service-architecture" }

scope:
  term: scope
  kind: system
  aliases: [scoped composable]
  definition: >-
    The keyed registry mechanism that gives each composable instance an isolated,
    reusable footprint so multiple baskets or products can coexist on one page
    without sharing state. Scope keys namespace every module's reactive state.
  referents:
    - { type: adr, id: "adr:001-scope-based-composables" }

product:
  term: product
  kind: domain
  aliases: [catalogue product]
  definition: >-
    A sellable item in a brand's catalogue — hosting plans, domains, add-ons —
    with its pricing, billing cycles, and configuration options. Products are
    browsed via the catalogue and added to the basket.
  referents:
    - { type: symbol, id: "@upmind-automation/headless!useProductCatalogue" }
    - { type: symbol, id: "@upmind-automation/headless!Product" }

promotion:
  term: promotion
  kind: domain
  aliases: [coupon, discount]
  definition: >-
    A discount or offer applied to a basket, typically via a promo code, that
    adjusts line-item or order totals. Promotions are validated and applied
    through the basket promotions composable.
  referents:
    - { type: symbol, id: "@upmind-automation/headless!useBasketPromotions" }
    - { type: symbol, id: "@upmind-automation/headless!PromotionModel" }

payment-gateway:
  term: payment gateway
  kind: domain
  aliases: [gateway]
  definition: >-
    A provider integration (Stripe, PayPal, and others) that authorises and
    captures payment for an order. Gateways are abstracted behind a common
    interface so the checkout flow is provider-agnostic.
  referents:
    - { type: symbol, id: "@upmind-automation/headless!usePaymentGateway" }
    - { type: adr, id: "adr:015-payment-gateway-abstractions" }

currency:
  term: currency
  kind: domain
  aliases: [display currency]
  definition: >-
    The currency a basket is priced and displayed in. Changing the basket
    currency re-prices every line item; the selection is managed by the basket
    currency composable.
  referents:
    - { type: symbol, id: "@upmind-automation/headless!useBasketCurrency" }

domain:
  term: domain
  kind: domain
  aliases: [domain name]
  definition: >-
    A domain-name product — searched for availability, registered or
    transferred, and configured as part of an order. Domain search and lifecycle
    are handled by the domain composable.
  referents:
    - { type: symbol, id: "@upmind-automation/headless!useDomain" }
    - { type: symbol, id: "@upmind-automation/headless!DomainModel" }

theming:
  term: theming
  kind: system
  aliases: [theme]
  definition: >-
    The per-brand visual configuration (colours, typography, layout tokens) that
    lets one headless codebase render many branded storefronts. Theme values are
    resolved by the theming composable.
  referents:
    - { type: symbol, id: "@upmind-automation/headless!useTheming" }
    - { type: adr, id: "adr:012-multi-theme-architecture" }

query:
  term: query
  kind: system
  aliases: [tanstack query, query client]
  definition: >-
    The TanStack Query layer that fetches, caches, and invalidates server data
    behind every composable. Query keys and the shared query client are exposed
    through the query composable.
  referents:
    - { type: symbol, id: "@upmind-automation/headless!useQuery" }
    - { type: adr, id: "adr:006-tanstack-query" }

order:
  term: order
  kind: domain
  aliases: [purchase]
  definition: >-
    The invoice-payment lifecycle a basket converts into at checkout —
    orchestrated by the order machine, which spawns the payment-detail actor
    and drives retry and partial-payment loops until the invoice is settled.
  referents:
    - { type: symbol, id: "@upmind-automation/headless!useOrder" }
    - { type: symbol, id: "@upmind-automation/headless!OrderContext" }

invoice:
  term: invoice
  kind: domain
  aliases: [bill]
  definition: >-
    The billable document raised for an order — client, currency, line items,
    payment history, and the paid/unpaid amount summary. Invoice data is
    loaded and invalidated by the invoice composable.
  referents:
    - { type: symbol, id: "@upmind-automation/headless!useInvoice" }
    - { type: symbol, id: "@upmind-automation/headless!Invoice" }

client:
  term: client
  kind: domain
  aliases: [client profile]
  definition: >-
    The authenticated customer's profile and account standing — identity,
    contact details, and the account-lifecycle state (unregistered, unverified,
    verified) layered on top of it.
  referents:
    - { type: symbol, id: "@upmind-automation/headless!Client" }
    - { type: symbol, id: "@upmind-automation/headless!Account" }

brand:
  term: brand
  kind: system
  definition: >-
    The white-labelled organisation a storefront runs as — its settings,
    configuration values, and enabled modules, fetched and unified by the
    brand composable.
  referents:
    - { type: symbol, id: "@upmind-automation/headless!useBrand" }

account:
  term: account
  kind: system
  aliases: [client lifecycle]
  definition: >-
    The post-auth standing arc a client moves through — unregistered,
    unverified, verified — scoped by actor and managed by the account
    composable.
  referents:
    - { type: symbol, id: "@upmind-automation/headless!useAccount" }

auth:
  term: auth
  kind: system
  aliases: [authentication, login]
  definition: >-
    Unified authentication for guest, client, and staff actors — login,
    registration, and session establishment, handled by the auth composable.
  referents:
    - { type: symbol, id: "@upmind-automation/headless!useAuth" }

payment:
  term: payment
  kind: domain
  aliases: [payment method]
  definition: >-
    The state, context, and actions that orchestrate a single payment attempt
    against a gateway — meta-information, error handling, and the pay/refresh
    event triggers, driven by the payment composable's state machine.
  referents:
    - { type: symbol, id: "@upmind-automation/headless!usePayment" }
    - { type: symbol, id: "@upmind-automation/headless!PaymentContext" }

system:
  term: system
  kind: system
  aliases: [reference data]
  definition: >-
    Brand-agnostic reference data (countries, currencies, statuses, billing
    cycles, ticket departments, and similar lookups) exposed through the
    system composable.
  referents:
    - { type: symbol, id: "@upmind-automation/headless!useSystem" }

billing:
  term: billing
  kind: domain
  aliases: [basket billing, billing cycle]
  definition: >-
    The billing details attached to a basket — validating, updating, and
    clearing them, and observing the billing lifecycle's state transitions —
    managed by the basket billing composable.
  referents:
    - { type: symbol, id: "@upmind-automation/headless!useBasketBilling" }

recommendations:
  term: recommendations
  kind: domain
  aliases: [product recommendations, upsell]
  definition: >-
    Suggested products surfaced from the recommendation engine — either scoped
    to a specific product (for product-detail or post-add-to-basket upsell) or
    fetched generally — via the recommendations composables.
  referents:
    - { type: symbol, id: "@upmind-automation/headless!useProductRecommendations" }
    - { type: symbol, id: "@upmind-automation/headless!useRecommendations" }

routing:
  term: routing
  kind: system
  aliases: [funnel navigation]
  definition: >-
    Route management, navigation, and flow control across the storefront —
    integrating internationalisation, session, and basket state to resolve
    routes and drive funnel progression.
  referents:
    - { type: symbol, id: "@upmind-automation/headless!useRoutingEngine" }
    - { type: adr, id: "adr:017-funnel-navigation-via-state-meta" }

feedback:
  term: feedback
  kind: system
  aliases: [notifications]
  definition: >-
    User-facing messages — errors, successes, warnings, and system
    notifications — added, dismissed, and displayed through a global feedback
    state machine.
  referents:
    - { type: symbol, id: "@upmind-automation/headless!useFeedback" }

custom-field:
  term: custom field
  kind: domain
  definition: >-
    A brand-configured question attached to clients — its definition (code,
    type, required/visibility rules) is shared across every client on the
    brand; only the value differs per client. Definitions and their value
    semantics (per-type coercion, schema/form generation, the image-upload
    flow for the IMAGE type) are read through the client custom fields
    composables; a specific client's own values live on that client's
    personal details.
  referents:
    - { type: symbol, id: "@upmind-automation/headless!useClientCustomFields" }
    - { type: symbol, id: "@upmind-automation/headless!useClientCustomFieldImage" }
    - { type: symbol, id: "@upmind-automation/headless!CustomField" }
    - { type: symbol, id: "@upmind-automation/headless!CustomFieldModel" }

personal-details:
  term: personal details
  kind: domain
  aliases: [profile]
  definition: >-
    A client's own profile record — native fields (first name, last name,
    public name, interface language) plus the client's own custom field
    values — read and edited through a diff-only save. Distinct from the
    custom field definitions and value semantics it consumes, which are owned
    by the client custom fields composables.
  referents:
    - { type: symbol, id: "@upmind-automation/headless!usePersonalDetails" }
    - { type: symbol, id: "@upmind-automation/headless!usePersonalDetailsManager" }
    - { type: symbol, id: "@upmind-automation/headless!ProfileModel" }
